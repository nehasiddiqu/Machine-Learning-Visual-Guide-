T.push({
  id:'a431',code:'A4.3.1',group:'Techniques and models',short:'Linear regression',title:'Linear regression for continuous outcomes',
  blurb:'Slope, intercept and r-squared.',
  verb:'Explain',cmd:'Give reasons: why the line predicts what it does and why r² measures fit. Defining terms alone will not reach top marks.',
  ls:'Explain how linear regression is used to predict continuous outcomes.',
  lead:'Linear regression is a <b>supervised</b> algorithm that fits a straight line through labelled data so you can read a prediction off the line. It predicts a <b>continuous outcome</b>: a number that can take any value in a range, such as temperature, house price or test score. You interpret the slope, intercept and r²; you are not asked to calculate them by hand.',
  hook:'You have each student\'s revision hours and exam mark. Which goes on the x-axis, and which value are you actually trying to predict?',
  stageTitle:'3D lab: fit your own line',stageSub:'Set slope and intercept, compare with the line of best fit, and read r²',
  lab:{how:['Drag the <b>slope</b> and <b>intercept</b> sliders. Watch the red residual sticks shrink as your line approaches the best fit.','Press <b>Snap to best fit</b>, then switch datasets between hours studied and attendance.','Use the <b>Predict</b> slider to read a prediction off the line.'],
    see:['The best-fit line minimises the overall distance from the line to all points.','High r² means the points hug the line. Low r² means they scatter widely even though a line still exists.','Slope is the change in y for every one-unit increase in x. Intercept is the prediction at x = 0.']},
  sections:[
    {tag:'Variables',h:'Predictor and response',p:'Linear regression is supervised: it learns from data already labelled with the answer. It models how two variables relate.',ul:['The <b>independent variable</b> (predictor) is the input used to predict. It goes on the <b>x-axis</b>.','The <b>dependent variable</b> (response) is the value being predicted. It goes on the <b>y-axis</b>. The response depends on the predictor.','Test score against hours studied: score is the response, hours is the predictor, because the score is expected to follow from study time.','Different from classification, which predicts a category rather than a number.']},
    {tag:'Line',h:'Line of best fit, slope and intercept',p:'Regression finds the single straight line that best represents the points. It minimises the overall distance between the line and the data points, so no other straight line sits closer to the data as a whole. The equation is <b>y = mx + c</b>.',ul:['<b>Intercept c:</b> the predicted y when x is zero. The baseline the model starts from (the score for a student who did no revision).','<b>Slope m:</b> how much y is expected to change for every one-unit increase in x. A slope of 10 means each extra hour is associated with about 10 more marks. A negative slope means y falls as x rises (car price against age, slope -100: price drops about 100 per year).']},
    {tag:'Example',h:'Worked example',eg:true,p:'A model gives score = 10 x hours + 2. Predict the score for 6 hours.',ul:['Substitute x = 6: score = (10 x 6) + 2 = <b>62</b>.','The slope turned 6 hours into 60 marks; the intercept added the baseline of 2.','Interpretation (what earns the mark): each additional hour of study is associated with about 10 extra marks, with units.']},
    {tag:'Fit',h:'How well does the model fit? r²',p:'Any set of points has a line of best fit, but that does not make the line useful. The usual measure of fit is <b>r² (r-squared)</b>, a value from 0 to 1.',ul:['r² is the <b>proportion of the variation in the response that the model explains</b> using the predictor.','r² = 0: the model explains none of the variation; the predictor tells you nothing.','r² = 1: perfect fit; every point is on the line.','r² = 0.85: the model accounts for about 85% of the variation, generally a strong fit.','Attendance may be a weak predictor of score (r² near 0.03). Hours studied is a strong predictor (r² near 0.99).']}
  ],
  keys:[{t:'Key idea',html:'r² answers one question: how much of the variation in the response does the model actually explain? The closer to 1, the more of the story the line captures.'}],
  tables:[{h:'Summary reference',head:['Term','What it means'],rows:[
    ['Continuous outcome','A numerical value in a range (temperature, price, score), not a category'],
    ['Predictor (independent variable)','The input used to predict; on the x-axis'],
    ['Response (dependent variable)','The value being predicted; on the y-axis'],
    ['Line of best fit','The straight line that minimises the overall distance to the data points'],
    ['Regression equation y = mx + c','The equation of the line of best fit'],
    ['Slope m','Change in the response for each one-unit increase in the predictor'],
    ['Intercept c','Predicted response when the predictor is zero; the baseline'],
    ['r² (r-squared)','Proportion of variation in the response the model explains, 0 to 1']]}],
  traps:['Using linear regression to decide spam or not spam. That is classification. Regression predicts a <b>number</b>, not a label.','Saying "the slope is 10" without interpreting it. The mark is for the meaning: each extra hour is associated with about 10 more marks, with units.','Thinking r² is the percentage of predictions that are right. It measures how much <b>variation</b> the line explains.','Believing a high r² proves the predictor <b>causes</b> the response. Two variables can move together for reasons that are not causal.'],
  gloss:[['Continuous outcome','A number that can take any value in a range.'],['Predictor','Independent variable; the input; x-axis.'],['Response','Dependent variable; the predicted value; y-axis.'],['Line of best fit','The line minimising overall distance to the points.'],['Slope','Change in y per one-unit change in x.'],['Intercept','Value of y when x is 0.'],['r²','Proportion of variation in the response explained by the model.']],
  quiz:[
    {t:'one',q:'Linear regression is a supervised learning technique used to predict what kind of outcome?',o:['A discrete category','A continuous value','An unsupervised cluster','A class label'],a:1,why:'Regression predicts a number on a continuous scale.'},
    {t:'one',q:'In the model Price = -100 x Age + 5000, what does the slope of -100 represent?',o:['The starting price is -$100','The price of a new item is $100','For every year older, the price increases by $100','For every year older, the price decreases by $100 on average'],a:3,why:'A negative slope means y falls as x rises.'},
    {t:'one',q:'A model has r² = 0.15. This indicates:',o:['The slope is 0.15','The model explains very little of the variability','15% of predictions are correct','The model is a very good fit'],a:1,why:'r² is the proportion of variation explained. 0.15 is a weak fit.'},
    {t:'one',q:'The "line of best fit" is the line that:',o:['Passes through the most data points possible','Has the steepest possible slope','Minimises the overall distance from the line to all data points','Connects the first and last points'],a:2,why:'It minimises overall distance to the points.'},
    {t:'one',q:'Which problem suits linear regression?',o:['Classifying an email as spam or not spam','Identifying a person in a photo','Grouping customers into market segments','Predicting tomorrow\'s temperature from today\'s'],a:3,why:'It predicts a continuous number.'},
    {t:'multi',q:'Select <b>all</b> true statements about linear regression.',o:['It predicts a continuous numerical outcome','It requires labelled training data','It sorts data into clusters without labels','It only works when the slope is positive'],a:[0,1],why:'It is supervised and numeric.'},
    {t:'tf',q:'Linear regression can be used to predict which category a data point belongs to.',a:false,why:'That is classification.'},
    {t:'tf',q:'A high r² proves that the predictor causes the change in the response.',a:false,why:'r² measures explained variation, not cause.'},
    {t:'one',q:'In y = mx + c, the intercept c is the predicted value of y when x equals:',o:['1','0','m','c'],a:1,why:'Substitute x = 0 and y = c.'},
    {t:'one',q:'A model says score = 8 x hours + 5. Predict the score for 7 hours.',o:['43','56','61','96'],a:2,why:'8 x 7 + 5 = 61.'},
    {t:'one',q:'r² = 0 means the model explains ___ of the variation, and r² = 1 means it explains ___.',o:['none, all','all, none','half, all','none, half'],a:0,why:'0 explains none; 1 explains all.'}
  ],
  paper:[
    {q:'A model predicting a student\'s test score from hours studied has the equation score = 9 x hours + 4. Explain what the slope and the intercept tell you about this relationship.',m:2,pts:['The slope 9: each additional hour studied is associated with about 9 more marks.','The intercept 4: the predicted score for a student who studied zero hours (the baseline).']},
    {q:'Two linear regression models predict the same test scores. Model A uses hours studied and has r² = 0.92. Model B uses attendance and has r² = 0.05. Explain which is the better predictor and what these values tell you.',m:4,pts:['Model A is the better predictor.','r² is the proportion of variation in the response that the model explains.','A explains about 92% of the variation in scores, so points lie close to the line.','B explains only about 5%, so attendance tells you almost nothing and the points scatter widely. (Neither value proves cause.)']}
  ]
});

T.push({
  id:'a432',code:'A4.3.2',group:'Techniques and models',short:'Classification: K-NN and trees',title:'Classification techniques',
  blurb:'K-nearest neighbours and decision trees.',
  verb:'Explain',cmd:'Give reasons, not just names. For each algorithm say how it turns labelled data into a prediction for a new point, and why.',
  ls:'Explain how classification techniques in supervised learning are used to predict discrete categorical outcomes.',
  lead:'Linear regression predicts how much. <b>Classification</b> predicts <b>which kind</b>: it assigns a new observation to one of a fixed set of categories such as spam or not spam. It is supervised, so it learns from data already labelled with the correct category. Two algorithms to know: <b>K-nearest neighbours (K-NN)</b> and <b>decision trees</b>.',
  hook:'A new point has three known neighbours: two are class B and one is class A. Which class would K-NN give it, and why?',
  stageTitle:'3D lab: vote with neighbours, walk down a tree',stageSub:'Place a point and change k; follow a patient through a decision tree',
  lab:{how:['On <b>K-NN</b>, click anywhere on the floor to drop a new point. Change <b>k</b> and see which neighbours vote.','Place a point next to a lone odd one out and compare k = 1 with k = 7.','On <b>Decision tree</b>, toggle <b>Fever</b> and <b>Cough</b> and press <b>Walk the path</b>.'],
    see:['The class is the majority vote of the k nearest labelled points. Distance decides everything.','Very small k lets one odd point decide, so the model is sensitive to noise. Large k smooths noise but blurs real boundaries.','Each root-to-leaf path in a tree is one readable rule, so you can see why the answer was given.']},
  sections:[
    {tag:'Idea',h:'What classification predicts',p:'The outcome is a <b>discrete categorical value</b>, a label from a fixed set, not a number on a continuous scale. "What will the temperature be?" is regression. "Will it rain, yes or no?" is classification. Do not confuse it with clustering, which is unsupervised and works on unlabelled data.'},
    {tag:'K-NN',h:'K-Nearest Neighbours',p:'A point is probably the same kind of thing as the points nearest to it. To classify a new, unlabelled point:',ol:['Choose a value of <b>k</b> (before the algorithm runs).','Measure the distance from the new point to every labelled point.','Find the <b>k nearest</b> labelled points.','Take a <b>majority vote</b> of their classes.','Assign the new point the most common class.'],p2:'K-NN builds no model in advance. It classifies each new point on demand. A very small k (such as 1) lets one odd or mislabelled point decide, so it is sensitive to noise. A large k smooths noise but blurs genuine boundaries and costs more to compute. Choosing k well links to hyperparameter tuning (A4.3.3).'},
    {tag:'Use',h:'Application: collaborative filtering',p:'Recommendation systems at Netflix or Amazon use the same idea. To recommend to you, the system finds users whose past choices are closest to yours (your nearest neighbours in taste) and suggests items they liked that you have not seen.'},
    {tag:'Tree',h:'Decision trees',p:'A decision tree classifies by asking a sequence of yes/no questions, like a flowchart. The algorithm learns the hierarchy of questions from labelled data. To classify, start at the top, answer one question at each step and follow the matching branch to a final label.',ul:['<b>Root node:</b> the top node; the first question; represents the whole dataset.','<b>Decision node:</b> an internal node that tests one feature (for example "does the patient have a fever?").','<b>Leaf node:</b> a terminal node carrying the final class label (for example "likely flu").','Every path from root to leaf is one complete rule.','<b>Application:</b> medical diagnosis from symptoms. Highly interpretable: you can read the path and see exactly why the model gave its answer.']}
  ],
  tables:[{h:'K-NN and decision trees compared',head:['Feature','K-Nearest Neighbours','Decision tree'],rows:[
    ['How it classifies','Majority vote of the k nearest labelled points','A path of yes/no tests from root to leaf'],
    ['Basis of the decision','Distance to neighbouring points','Learned if-then rules on features'],
    ['Key choice','The value of k','Which features to test, and in what order'],
    ['Interpretability','Harder to read: the reason is "your neighbours voted this way"','Highly interpretable: the path is the reason'],
    ['Typical application','Collaborative filtering recommendations','Medical diagnosis from symptoms']]}],
  keys:[{t:'Key idea',html:'K-NN does not build a model in advance: distance decides everything. A decision tree turns classification into a readable path of yes/no tests from the root to a leaf.'}],
  traps:['Confusing classification with clustering. If the question mentions existing labels and a category to predict, it is classification (supervised).','Mixing up leaf and decision nodes. A decision node tests a feature and has branches onward. A leaf node is a dead end carrying the final class label. The root is simply the first decision node.','Saying K-NN builds if-then rules. A decision tree does that; K-NN votes among neighbours.'],
  gloss:[['Classification','Predicting a discrete category for a new observation from labelled data.'],['Discrete categorical outcome','A label from a fixed set.'],['K-NN','Classifies by majority vote of the k nearest labelled points.'],['k','Number of neighbours that vote; chosen before the model runs.'],['Collaborative filtering','Recommending using the choices of similar users.'],['Decision tree','Classifies by yes/no tests from root to leaf.'],['Root node','Top node; first test; whole dataset.'],['Decision node','Internal node that tests one feature.'],['Leaf node','Terminal node carrying the final class label.']],
  quiz:[
    {t:'one',q:'The primary goal of a classification algorithm is to predict:',o:['A linear equation','A discrete category for a new observation','The mean of the data','A set of clusters'],a:1,why:'Classification assigns a category.'},
    {t:'one',q:'A recommender that suggests products based on what similar users bought is an example of:',o:['A regression problem','Collaborative filtering','Medical diagnosis','A decision tree'],a:1,why:'Similar users are the nearest neighbours in taste.'},
    {t:'one',q:'Predicting whether an email is Spam or Not Spam is a:',o:['Reinforcement learning task','Clustering task','Regression task','Classification task'],a:3,why:'Labelled data and fixed categories.'},
    {t:'one',q:'In a medical decision tree, a node asking "Is the temperature > 38°C?" is a:',o:['Leaf node','Root node','Decision node','It could be a root or decision node'],a:3,why:'The root is just the first decision node, so position decides.'},
    {t:'multi',q:'Select <b>all</b> true statements about supervised classification.',o:['It learns from data that is already labelled','It predicts a discrete category','It predicts a continuous numerical value','It groups unlabelled data into clusters'],a:[0,1],why:'Classification is supervised and predicts categories.'},
    {t:'tf',q:'K-NN builds an explicit set of if-then rules during training.',a:false,why:'K-NN votes among neighbours at prediction time.'},
    {t:'tf',q:'A decision tree can be read by a human to see why it reached a classification.',a:true,why:'Each root-to-leaf path is a readable rule.'},
    {t:'one',q:'In K-NN with k = 3, a new point has neighbours: 2 triangles and 1 square. The point is classified as:',o:['Square','Triangle','Unclassified','Both'],a:1,why:'Majority vote: two triangles beat one square.'},
    {t:'one',q:'A very small k (such as 1) makes K-NN:',o:['Insensitive to noise','Sensitive to noise, since one odd point can decide','Slower than large k','Unable to classify'],a:1,why:'One mislabelled neighbour can decide the result.'},
    {t:'order',q:'Put the steps K-NN takes to classify a new point in order.',o:['Choose a value of k','Measure the distance from the new point to every labelled point','Find the k nearest labelled points','Take a majority vote of their classes','Assign the new point the most common class'],why:'Choose k, measure, find nearest, vote, assign.'}
  ],
  paper:[
    {q:'Explain how the K-NN algorithm classifies a new, unlabelled data point.',m:2,pts:['It finds the k nearest labelled points to the new point (using distance).','It takes a majority vote of their classes and assigns the most common class to the new point.']},
    {q:'A hospital is choosing between K-NN and a decision tree to classify a patient\'s likely condition from symptoms. Explain how a decision tree reaches a classification, and give one reason a decision tree may be preferred here.',m:4,pts:['It starts at the root node and answers a yes/no question about one feature.','It follows the matching branch through decision nodes until it reaches a leaf node.','The leaf node carries the final class label (for example likely flu).','Preferred because it is interpretable: doctors can read the path and see why a diagnosis was given.']}
  ]
});

T.push({
  id:'a433',code:'A4.3.3',group:'Techniques and models',short:'Evaluation and tuning',title:'Hyperparameter tuning and evaluating models',
  blurb:'Accuracy, precision, recall, F1, over/underfitting.',
  verb:'Explain',cmd:'Say what each metric measures and why one may matter more, and how tuning a hyperparameter changes performance and avoids overfitting and underfitting.',
  ls:'Explain the role of hyperparameter tuning when evaluating supervised learning algorithms.',
  lead:'Building a classifier is half the work. The other half is judging how good it is and adjusting it. This topic covers four metrics (<b>accuracy, precision, recall, F1</b>), two ways to fail to generalise (<b>overfitting</b> and <b>underfitting</b>), and how <b>hyperparameter tuning</b> uses the metrics to find the best level of complexity.',
  hook:'A disease affects 1% of people. A lazy model says "no disease" for everyone. It is 99% accurate. Why is it useless?',
  stageTitle:'3D lab: metrics, fit and tuning',stageSub:'Build a confusion matrix, bend a curve, and sweep a hyperparameter',
  lab:{how:['On <b>Confusion matrix</b>, change TP, FP, FN and TN, or press <b>Lazy model</b> to see the accuracy paradox.','On <b>Over and underfitting</b>, raise model complexity and compare training error (teal) with test error (coral).','On <b>Tuning sweep</b>, press <b>Run tuning</b> and watch each value of k get trained and scored on unseen data.'],
    see:['Accuracy hides the dangerous misses on imbalanced data. Recall exposes them.','Training error always falls with complexity. Test error falls, then rises again: that is overfitting.','Tuning picks the setting that scores best on unseen data, not on the training set.']},
  sections:[
    {tag:'Accuracy',h:'Why accuracy is not enough',p:'<b>Accuracy</b> is the percentage of predictions that were right. For a rare disease affecting 1% of people, a lazy model predicting "no disease" for everyone is 99% accurate yet finds none of the sick patients. This is the <b>accuracy paradox</b>: on an imbalanced dataset, high accuracy can hide a model that fails on the cases you care about.'},
    {tag:'Matrix',h:'The confusion matrix',p:'A table comparing predicted with actual, splitting predictions into four outcomes.',ul:['<b>True positive (TP):</b> predicted positive, was positive. Correct.','<b>True negative (TN):</b> predicted negative, was negative. Correct.','<b>False positive (FP):</b> predicted positive, was negative. A false alarm.','<b>False negative (FN):</b> predicted negative, was positive. A dangerous miss.','Which error is worse depends on the problem.']},
    {tag:'Metrics',h:'Precision, recall and F1',ul:['<b>Precision = TP / (TP + FP).</b> Of the predicted positives, how many were correct. High precision means few false alarms. Prioritise it when a false positive is costly (a spam filter must not bin an important email).','<b>Recall (sensitivity) = TP / (TP + FN).</b> Of the actual positives, how many were found. High recall means few misses. Prioritise it when a false negative is costly (screening for a serious disease).','<b>F1 = 2 x (precision x recall) / (precision + recall).</b> The harmonic mean. It stays low if either metric is low, so it is high only when both are high.','Precision and recall pull against each other: pushing one up often drags the other down.']},
    {tag:'Example',h:'Worked example',eg:true,p:'A confusion matrix has TP = 40, FP = 10, FN = 30, TN = 920.',ul:['Accuracy = (40 + 920) / 1000 = <b>96%</b>.','Precision = 40 / (40 + 10) = <b>80%</b>.','Recall = 40 / (40 + 30) = <b>57%</b>.','F1 = 2 x 0.80 x 0.571 / (0.80 + 0.571) = <b>0.67</b>.','Accuracy looks excellent, yet the model misses 43% of real positives.']},
    {tag:'Fit',h:'Overfitting and underfitting',p:'The goal is a model that <b>generalises</b>: it performs well on new, unseen data, not just on the training data.',ul:['<b>Underfitting:</b> the model is too simple to capture the real pattern. Poor on training data and equally poor on new data.','<b>Overfitting:</b> the model is too complex and learns the training data too closely, including random noise. Near-perfect on training data, bad on new data. It memorised the examples.','A model that scores 100% on training data and 50% on new data is overfitted, not excellent. Performance on <b>unseen</b> data is the only measure of generalisation.']},
    {tag:'Tuning',h:'The role of hyperparameter tuning',p:'A <b>hyperparameter</b> is a configuration setting chosen <b>before</b> training, a dial on the algorithm rather than something learned from data. The value of k in K-NN and the maximum depth of a decision tree are hyperparameters. They control how complex the model can become.',ul:['<b>Tuning</b> systematically tries different values and keeps the combination that performs best on a test set, judged by a metric such as F1.','It moves a model along the line between underfitting and overfitting to find the complexity that generalises best.','A small k or shallow tree may underfit; a huge, deep model may overfit.','Tuning does not change the algorithm or the data. Metrics on unseen data make the search possible.']},
    {tag:'Steps',h:'The tuning process',ol:['Choose a range of values to try.','Train a model using each value.','Evaluate each on a test set using a metric such as F1.','Compare the results.','Keep the value that performs best on unseen data.']}
  ],
  keys:[{t:'Exam tip',html:'To explain the role of tuning, link three things in one line of reasoning: models can underfit or overfit; metrics on a test set reveal which is happening; tuning adjusts the hyperparameters to correct it.'}],
  tables:[{h:'Summary reference',head:['Term','What it means'],rows:[
    ['Accuracy','Proportion of all predictions that were correct; misleading on imbalanced data'],
    ['Confusion matrix','Table of true positives, true negatives, false positives, false negatives'],
    ['False positive','A false alarm'],['False negative','A dangerous miss'],
    ['Precision','TP / (TP + FP): of predicted positives, how many were correct'],
    ['Recall (sensitivity)','TP / (TP + FN): of actual positives, how many were found'],
    ['F1 score','Harmonic mean of precision and recall; high only when both are high'],
    ['Underfitting','Too simple; poor on training and new data'],['Overfitting','Too complex; good on training, poor on new data'],
    ['Hyperparameter','Setting chosen before training that controls complexity (for example k)'],
    ['Hyperparameter tuning','Trying settings to find the best-generalising model']]}],
  traps:['Trusting a high accuracy figure on an imbalanced dataset. It can be achieved by always predicting the majority class.','Swapping precision and recall. Precision is about the predictions made; recall is about the real positives that existed. Read which cost matters: a false alarm or a missed case.','Judging a model on its training performance.','Saying hyperparameters are learned from data. They are set before training.'],
  gloss:[['Accuracy paradox','High accuracy hiding a useless model on imbalanced data.'],['Confusion matrix','TP, TN, FP and FN counts.'],['Precision','TP / (TP + FP).'],['Recall','TP / (TP + FN).'],['F1 score','Harmonic mean of precision and recall.'],['Generalise','Perform well on unseen data.'],['Underfitting','Model too simple.'],['Overfitting','Model memorises noise.'],['Hyperparameter','A setting chosen before training.'],['Test set','Unseen data used to judge performance.']],
  quiz:[
    {t:'one',q:'A model detects fraud. A "False Positive" here is:',o:['A legitimate transaction correctly identified as not fraud','A fraudulent transaction missed by the model','A legitimate transaction incorrectly flagged as fraud','A fraudulent transaction correctly identified'],a:2,why:'A false alarm: predicted positive (fraud), actually negative.'},
    {t:'one',q:'For a serious-disease model, which metric is most important to maximise to avoid dangerous misses?',o:['The number of true negatives','Recall','Accuracy','Precision'],a:1,why:'Recall counts how many real positives were found.'},
    {t:'one',q:'A model scores 100% on training data and 50% on new data. This is a sign of:',o:['An imbalanced dataset','A good model','Overfitting','Underfitting'],a:2,why:'Memorised training data, fails on new data.'},
    {t:'one',q:'Which is a hyperparameter?',o:['The number of false positives','The number of training data points','The value of k in K-NN','The final accuracy'],a:2,why:'k is set before training.'},
    {t:'one',q:'TP = 40, FP = 10, FN = 30, TN = 920. What is the precision?',o:['20%','57%','80%','96%'],a:2,why:'40 / (40 + 10) = 80%.'},
    {t:'one',q:'With the same figures, what is the recall (to the nearest percent)?',o:['40%','57%','80%','96%'],a:1,why:'40 / (40 + 30) = 57%.'},
    {t:'multi',q:'Select <b>all</b> true statements about the F1 score.',o:['It is the harmonic mean of precision and recall','It is high only when both precision and recall are high','It is the percentage of predictions the model got right','It directly measures overfitting'],a:[0,1],why:'F1 balances precision and recall.'},
    {t:'tf',q:'On an imbalanced dataset, high accuracy always means the model is good.',a:false,why:'Always predicting the majority class gives high accuracy.'},
    {t:'tf',q:'An overfitted model performs well on training data but poorly on new data.',a:true,why:'It memorised the training data.'},
    {t:'one',q:'A hyperparameter is a configuration setting chosen ___ the training process begins.',o:['after','before','during','instead of'],a:1,why:'It is set before training.'},
    {t:'order',q:'Put the steps of hyperparameter tuning in order.',o:['Choose a range of values to try','Train a model using each value','Evaluate each on a test set using a metric such as F1','Compare the results','Keep the value that performs best on unseen data'],why:'Choose, train, evaluate, compare, keep the best.'}
  ],
  paper:[
    {q:'A model screens patients for a serious illness. Explain why recall may be a more important metric than precision in this situation.',m:2,pts:['Recall measures how many real positives (sick patients) the model found.','A false negative (missed sick patient) is far worse than a false alarm, so few misses (high recall) matters most.']},
    {q:'Explain the role of hyperparameter tuning in producing a model that performs well on new data.',m:4,pts:['A hyperparameter is a setting chosen before training that controls model complexity (such as k).','Models can underfit (too simple) or overfit (too complex).','Metrics on a test set (unseen data) reveal which is happening.','Tuning tries different values and keeps the one that performs best on unseen data, so the model generalises.']}
  ]
});

T.push({
  id:'a434',code:'A4.3.4',group:'Techniques and models',short:'Clustering (k-means)',title:'Unsupervised learning: clustering',
  blurb:'k-means and customer segmentation.',
  verb:'Describe',cmd:'Give a detailed account of how clustering groups data: the steps, and the basis for grouping.',
  ls:'Describe how clustering groups data by feature similarity, for example k-means and customer segmentation.',
  lead:'Clustering is <b>unsupervised</b>. The data has no labels, and the algorithm must find natural groups on its own. Points in the same <b>cluster</b> are more similar to each other than to points in other clusters, with similarity measured across their <b>features</b>. The standard example is <b>k-means</b>.',
  hook:'You are handed a mixed box of fruit and no instructions. You start making piles of things that resemble each other. Nobody told you the categories. What are you doing?',
  stageTitle:'3D lab: watch k-means settle',stageSub:'Place centroids, assign, move, repeat until they stop',
  lab:{how:['Press <b>Step</b> to do assign then move, one half-step at a time. Or press <b>Run</b>.','Change <b>k</b> and press <b>New centroids</b>. Try a wrong k and compare.','On <b>Customer segments</b>, run k-means on spend, frequency and basket size and read the clusters.'],
    see:['Each point joins its nearest centroid. Each centroid moves to the mean of its points.','The algorithm stops when centroids no longer move (convergence).','A centroid is a calculated centre, not one of the data points. k is chosen in advance.']},
  sections:[
    {tag:'Idea',h:'What clustering is',p:'Clustering groups data points so that those in the same group (cluster) are more alike than those in other groups. It is never told what the correct groups are. It receives unlabelled data and finds the groupings itself from patterns in the features. Points close together in feature values are judged to belong together.'},
    {tag:'k-means',h:'How k-means groups data',p:'k-means divides the data into <b>k</b> clusters, where k is a number you choose before it runs. It repeats two simple steps until they settle.',ol:['Choose k, the number of clusters.','Place k <b>centroids</b> (the centres of clusters) at random positions.','<b>Assign</b> each data point to its nearest centroid. This makes k rough groups.','<b>Move</b> each centroid to the mean (average) position of all points assigned to it.','Repeat the assign and move steps until the centroids stop moving. The clusters are now stable (<b>convergence</b>).']},
    {tag:'Use',h:'Application: customer segmentation',p:'An online shop has purchase data for thousands of customers but does not know what types of customer it has. Running clustering on features such as average spend, purchase frequency and kinds of product bought groups customers by behavioural similarity.',ul:['One cluster may be <b>high-value spenders</b> who buy expensive items often; another <b>bargain hunters</b> who buy on sale; another <b>one-time buyers</b>.','The shop can then target each segment: exclusive offers for high-value spenders, win-back discounts for one-time buyers.','The algorithm finds the groups; <b>people give them meaning</b>. Naming a cluster "high-value spenders" and deciding what to do is human interpretation applied afterwards.']}
  ],
  tables:[{h:'Clustering and classification compared',head:['Feature','Clustering','Classification'],rows:[
    ['Type of learning','Unsupervised','Supervised'],['Training data','Unlabelled','Labelled with correct answers'],
    ['What it produces','Groups discovered from the data','A predicted label from known categories'],
    ['Are the groups known first?','No, they emerge from feature similarity','Yes, categories are defined in advance'],
    ['Example','Segmenting customers with no prior types','Marking an email spam or not spam']]}],
  keys:[{t:'Key idea',html:'k-means alternates two actions: assign every point to its nearest centroid, then move each centroid to the mean of its points. The algorithm stops when the centroids no longer move.'}],
  traps:['Calling clustering classification. Clustering is unsupervised: unlabelled data, groups discovered, not given.','Thinking a centroid is one of the data points. It is the <b>mean position</b> of its cluster and usually sits where no data point lies.','Saying the algorithm works out k. You choose k in advance.','Forgetting that the algorithm cannot name its clusters. A human interprets them.'],
  gloss:[['Unsupervised learning','Learning from unlabelled data.'],['Clustering','Grouping points by feature similarity.'],['Cluster','A group of points more similar to each other than to other points.'],['Feature similarity','How close points are across feature values.'],['k-means','Clustering algorithm using k centroids.'],['k','Number of clusters; chosen before the algorithm runs.'],['Centroid','Mean position of the points in a cluster.'],['Convergence','Centroids stop moving; clusters stable.'],['Customer segmentation','Grouping customers by behaviour.']],
  quiz:[
    {t:'one',q:'Clustering is an example of which main type of machine learning?',o:['Unsupervised learning','Supervised learning','Transfer learning','Reinforcement learning'],a:0,why:'It uses unlabelled data.'},
    {t:'one',q:'What is the primary goal of a clustering algorithm?',o:['To predict a label','To discover natural groups in unlabelled data','To count the features','To maximise a reward'],a:1,why:'It finds groups by feature similarity.'},
    {t:'one',q:'The centre of a cluster in k-means is a:',o:['Neighbour','Node','Centroid','Leaf'],a:2,why:'A centroid is the mean position.'},
    {t:'one',q:'When does k-means stop?',o:['When the centroids no longer move between steps','When all points have been seen once','After exactly 100 steps','When the user stops it'],a:0,why:'That is convergence.'},
    {t:'one',q:'A streaming service groups movies into "Quirky Comedies" and "Dark Sci-Fi" with no genre tags. This is:',o:['Reinforcement learning','Classification','Regression','Clustering'],a:3,why:'No labels, groups discovered.'},
    {t:'multi',q:'Select <b>all</b> true statements about clustering.',o:['It works on unlabelled data','It groups points by similarity in their features','It predicts a continuous number','It needs labelled examples to learn'],a:[0,1],why:'Clustering is unsupervised and groups by similarity.'},
    {t:'tf',q:'Clustering requires data that is already labelled with the correct groups.',a:false,why:'It works on unlabelled data.'},
    {t:'tf',q:'In k-means, a centroid is moved to the mean position of the points assigned to it.',a:true,why:'That is the move step.'},
    {t:'one',q:'In k-means, the number of clusters is set by choosing a value for ___ before the algorithm runs.',o:['n','k','c','r'],a:1,why:'k is chosen in advance.'},
    {t:'order',q:'Put the k-means steps in order.',o:['Choose k','Place k centroids at random positions','Assign each data point to its nearest centroid','Move each centroid to the mean of its assigned points','Repeat the assign and move steps until the centroids stop moving'],why:'Choose k, place, assign, move, repeat.'}
  ],
  paper:[
    {q:'Describe how the k-means algorithm groups a set of unlabelled data points into clusters.',m:3,pts:['Choose k and place k centroids at random positions.','Assign each point to its nearest centroid, then move each centroid to the mean of its assigned points.','Repeat assign and move until the centroids stop moving.']},
    {q:'An online retailer has purchasing data for thousands of customers but no labels. Describe how clustering could segment these customers, and give one benefit to the business.',m:4,pts:['Use features such as average spend, purchase frequency and product types.','The algorithm (such as k-means) groups customers by similarity of behaviour, with no predefined groups.','People interpret and name the clusters (for example high-value spenders, bargain hunters, one-time buyers).','Benefit: targeted marketing for each segment (for example exclusive offers to high spenders, win-back discounts to one-time buyers).']}
  ]
});

T.push({
  id:'a435',code:'A4.3.5',group:'Techniques and models',short:'Association rules',title:'Unsupervised learning: association',
  blurb:'If-then rules, support and confidence.',
  verb:'Describe',cmd:'Describe what an association rule is, how support and confidence are used to judge it, and interpret a rule for a scenario.',
  ls:'Describe association rule mining and its applications in market basket analysis and predictive policing.',
  lead:'Clustering finds groups of similar things. <b>Association rule mining</b> finds relationships between different things: which items tend to occur together. It is unsupervised and produces <b>if-then rules</b> such as "customers who buy bread and butter also tend to buy milk". <b>Support</b> and <b>confidence</b> tell you whether a rule is worth acting on.',
  hook:'A supermarket has millions of receipts and no labels. How could it find "what goes with what" without being told what to look for?',
  stageTitle:'3D lab: mine the baskets',stageSub:'Pick a rule and measure its support and confidence',
  lab:{how:['Each column of cubes is one shopping basket. Choose an <b>antecedent</b> and <b>consequent</b> item.','Read <b>support</b> and <b>confidence</b>, and see which baskets light up.','Slide the <b>minimum support</b> and <b>minimum confidence</b> filters to see which rules survive.'],
    see:['Support = share of all baskets that contain both sets. Confidence = of baskets with the antecedent, share that also have the consequent.','High support with low confidence is weaker than it looks.','The rule shows items occur together, not that one causes the other.']},
  sections:[
    {tag:'Idea',h:'Association rule mining',p:'A rule-based, unsupervised technique for discovering relationships between items in a large dataset. It works on unlabelled data and finds "if-then" rules describing how often items appear together, sifting for combinations that occur more than chance would suggest. The classic (possibly mythical) example: shoppers who buy nappies also unusually often buy beer.'},
    {tag:'Compare',h:'Clustering and association',p:'Both are unsupervised. Clustering looks for <b>groups of similar data points</b> and outputs clusters. Association looks for <b>relationships between items</b> and outputs if-then rules. Clustering asks "which points belong together?"; association asks "which items tend to occur together?".'},
    {tag:'Rule',h:'The anatomy of a rule',ul:['The <b>antecedent</b> is the "if" part: an item or set of items found in the data.','The <b>consequent</b> is the "then" part: the item or items found in combination with the antecedent.','{bread, butter} then {milk}: antecedent {bread, butter}, consequent {milk}. Read as "customers who buy bread and butter are also likely to buy milk".','Direction matters: {A} then {B} is not the same claim as {B} then {A}.']},
    {tag:'Measures',h:'Interpreting rules: support and confidence',ul:['<b>Support:</b> how often the items in a rule appear together across the whole dataset. "What proportion of all transactions contain these items?" High support means the rule applies to many cases.','<b>Confidence:</b> how reliable the rule is. "Of the transactions containing the antecedent, what proportion also contain the consequent?" High confidence means that when the "if" happens the "then" usually follows.','Rules worth acting on have <b>both</b>: high support (matters often) and high confidence (holds up).','High support but low confidence: occurs often yet does not predict the consequent well. Low support: applies to too few cases to be useful however reliable.']},
    {tag:'Use',h:'Applications',ul:['<b>Market basket analysis:</b> retailers learn what customers buy together. Place items that sell together near each other, bundle them (a "movie night" popcorn and drinks pack), and power "frequently bought together" suggestions.','<b>Predictive policing:</b> mine crime reports for rules such as {reports of vandalism, streetlight outages} then {incidents of theft}. The force can repair streetlights and increase patrols where the antecedent holds, aiming to prevent thefts rather than only react.','A rule tells you <b>where to act, not why</b> the pattern exists.']},
    {tag:'Steps',h:'Steps of a market basket analysis',ol:['Collect the transaction records.','Mine the data for rules linking items that appear together.','Filter the rules by support and confidence.','Interpret the strong rules that remain.','Act on the insight (for example adjust the store layout).']}
  ],
  tables:[{h:'Clustering and association compared',head:['Feature','Clustering','Association rule mining'],rows:[
    ['What it looks for','Groups of similar data points','Relationships between items'],
    ['Output','Clusters of points that resemble each other','If-then rules linking items'],
    ['Question it answers','Which points belong together?','Which items tend to occur together?'],
    ['Example','Segmenting customers into types','Finding that bread and butter go with milk']]}],
  keys:[{t:'Key idea',html:'Every association rule is antecedent then consequent. Support shows it is <b>common</b>; confidence shows it is <b>reliable</b>. You need both.'}],
  traps:['Reading a rule as cause and effect. {rainy day} then {umbrella sale} means umbrella sales are likely when it rains, not that selling umbrellas causes rain.','Assuming high support means high confidence. Two popular items can appear together often by chance while the if-then link is weak.','Getting the direction wrong: {A} then {B} is not {B} then {A}.'],
  gloss:[['Association rule mining','Unsupervised technique that finds if-then relationships between items.'],['Antecedent','The "if" part of a rule.'],['Consequent','The "then" part of a rule.'],['Support','How often the items appear together across all transactions.'],['Confidence','Of transactions with the antecedent, how many also contain the consequent.'],['Market basket analysis','Association rules on retail data.'],['Predictive policing','Association rules on crime data to guide patrols and resources.']],
  quiz:[
    {t:'one',q:'Association rule mining is an example of which main type of machine learning?',o:['Reinforcement learning','Transfer learning','Unsupervised learning','Supervised learning'],a:2,why:'It works on unlabelled data.'},
    {t:'one',q:'In the rule {Coffee} then {Sugar}, "confidence" measures:',o:['The percentage of all transactions that contain both coffee and sugar','The total number of times coffee was sold','The popularity of coffee','The percentage of customers who bought coffee that also bought sugar'],a:3,why:'Confidence is conditional on the antecedent. The first option is support.'},
    {t:'one',q:'The best interpretation of {Rainy Day} then {Umbrella Sale} is:',o:['Selling umbrellas causes rain','All umbrella sales happen on rainy days','When the day is rainy, an umbrella sale is also likely','Umbrellas are sold on most days'],a:2,why:'Association shows co-occurrence, not cause.'},
    {t:'one',q:'Predictive policing uses association rules to:',o:['Identify patterns and environmental factors correlated with crime to help allocate resources','Predict the exact time and place of the next crime','Cluster criminals into groups','Decide if a suspect is guilty'],a:0,why:'It finds co-occurring factors to guide resources.'},
    {t:'one',q:'{Hot Dogs} then {Buns} likely has:',o:['Low support and high confidence','High support and high confidence','Low support and low confidence','High support and low confidence'],a:1,why:'Common and reliable.'},
    {t:'multi',q:'Select <b>all</b> true statements about the rule {A} then {B}.',o:['{A} is the antecedent, the "if" part','{B} is the consequent, the "then" part','The rule proves A causes B','It can only be applied to supermarket data'],a:[0,1],why:'It is if-then, not proof of cause.'},

T.push({
  id:'a436',code:'A4.3.6',group:'Techniques and models',short:'Reinforcement learning',title:'Reinforcement learning',
  blurb:'Agent, environment, reward, policy.',
  verb:'Describe',cmd:'Describe the steps of the interaction loop, what each concept is, and what the exploration versus exploitation trade-off involves. Use an example.',
  ls:'Describe how reinforcement learning works: the agent-environment loop, cumulative reward, and exploration versus exploitation.',
  lead:'Reinforcement learning (RL) has no dataset of labelled examples and no pile of unlabelled data. An <b>agent</b> learns by doing: it acts, sees what happens, and adjusts. The algorithms and maths behind policy updates are <b>not</b> required. You need the parts, how they interact, cumulative reward, and the exploration/exploitation trade-off.',
  hook:'An agent has found one route through a maze to the exit. Should it keep taking that route every time, or occasionally try a different turning? What would each choice cost and gain?',
  stageTitle:'3D lab: a robot learns a maze',stageSub:'Train an agent, then balance trying new things against using what it knows',
  lab:{how:['On <b>Maze learner</b>, press <b>Train</b> and watch the green arrows (the policy) form. Raise or lower the exploration rate.','Set exploration to 0 and train again. Does the agent find the shortcut?','On <b>Explore or exploit</b>, press <b>Pull</b> or <b>Auto play</b> and compare strategies across three restaurants.'],
    see:['The reward comes after each action, from the environment. No dataset is given.','The agent chases the total reward over the whole run, so it may accept a small loss now for a bigger gain later.','Pure exploitation can lock onto a good-but-not-best option. Pure exploration never settles. A good agent does both.']},
  sections:[
    {tag:'Loop',h:'The agent-environment interaction loop',p:'RL is a continuous loop between an <b>agent</b> (the learner making decisions) and the <b>environment</b> (the world it acts in). The agent learns from the consequences of its own actions, one step at a time.',ol:['The agent <b>observes</b> the current state of the environment.','Using its <b>policy</b>, it chooses an <b>action</b>.','The environment changes to a <b>new state</b> and returns a <b>reward</b>.','The agent uses the new state and reward to adjust its strategy.','The cycle repeats from the new state. Over many repetitions the agent learns which actions lead to good outcomes.']},
    {tag:'Parts',h:'The six foundational concepts',p:'Running example: a robot finding its way through a maze.',ul:['<b>Agent:</b> the learner or decision-maker being trained (the robot).','<b>Environment:</b> the world the agent operates in and reacts to (the maze).','<b>State:</b> a snapshot of the environment at a moment (the robot\'s current position).','<b>Action:</b> a move the agent can make from a state (step forward, turn left).','<b>Reward:</b> feedback after an action, positive for a good move (closer to the exit), negative for a bad one (hitting a wall).','<b>Policy:</b> the agent\'s strategy, the rule for choosing an action in each state. Training aims to reach a good policy.']},
    {tag:'Goal',h:'Cumulative reward',p:'The agent maximises its <b>cumulative reward</b>: the total reward over the whole run, not the immediate reward from one action. This lets it accept a small loss now for a larger gain later, such as taking a longer route that avoids a dead end.'},
    {tag:'Trade-off',h:'Exploration versus exploitation',ul:['<b>Exploitation:</b> use what the agent already knows; choose an action it has learned gives good reward. Safe and reliable, like returning to a restaurant you know is good.','<b>Exploration:</b> try a new or random action to see what happens. It might be worse, but it might uncover a much better strategy, like trying an unfamiliar restaurant.','An agent that <b>only exploits</b> can get stuck with a strategy that is merely good, not best. An agent that <b>only explores</b> never settles down to use what it has learned.','Balancing the two is one of the central challenges of RL.']}
  ],
  tables:[{h:'Summary reference',head:['Term','What it means'],rows:[
    ['Reinforcement learning','Learning by interacting with an environment through trial and error'],['Agent','The learner or decision-maker being trained'],['Environment','The world the agent operates in and reacts to'],['State','A snapshot of the environment at a moment'],['Action','A move the agent can make from a given state'],['Reward','Feedback returned after an action, positive or negative'],['Cumulative reward','Total reward over the long run; the agent\'s goal'],['Policy','The agent\'s strategy for choosing an action in each state'],['Exploitation','Choosing an action already known to give good reward'],['Exploration','Trying a new action to discover a possibly better strategy']]}],
  keys:[{t:'Key idea',html:'RL is a loop, not a one-off. The agent acts, the environment responds with a new state and a reward, and this repeats. Learning happens through trial and error across many turns, not from a fixed dataset.'}],
  traps:['Confusing <b>reward</b> with <b>policy</b>. Reward is feedback from the environment after an action. Policy is the agent\'s own strategy for choosing actions.','Saying the agent picks the action with the highest <b>instant</b> reward. The goal is <b>cumulative</b> reward over time.','Treating exploration and exploitation as a choice of one or the other. A successful agent must do both.','Thinking there is a labelled dataset. The reward comes after the action; it is not a label supplied beforehand.'],
  gloss:[['Agent','Learner or decision-maker.'],['Environment','The world the agent acts in.'],['State','Snapshot of the environment.'],['Action','A move the agent can make.'],['Reward','Feedback after an action.'],['Cumulative reward','Total reward over the long run.'],['Policy','The agent\'s strategy for choosing actions.'],['Exploitation','Using known good actions.'],['Exploration','Trying new actions.']],
  quiz:[
    {t:'one',q:'Reinforcement learning is a paradigm where an agent learns by:',o:['Reusing a pre-trained model on a new task','Studying a large labelled dataset','Interacting with an environment through trial and error','Finding hidden clusters in unlabelled data'],a:2,why:'Trial, error and reward.'},
    {t:'one',q:'In RL, what is the agent\'s goal?',o:['Maximise cumulative reward over time','Maximise one immediate reward','Minimise the number of actions','Reduce the exploration rate to zero'],a:0,why:'Cumulative reward over the long run.'},
    {t:'one',q:'Which is the best example of an RL problem?',o:['Training an AI to master Go by playing itself','Classifying customer reviews as positive or negative','Predicting a house price from its size','Grouping shoppers by purchase history'],a:0,why:'An agent acting and receiving rewards.'},
    {t:'one',q:'When an RL agent tries a new random move instead of the move it thinks is best, it is:',o:['Classification','Inference','Exploitation','Exploration'],a:3,why:'Trying something new is exploration.'},
    {t:'one',q:'The agent-environment interaction is best described as:',o:['A one-time data transfer','A continuous feedback loop','A linear process','A supervised training method'],a:1,why:'It repeats: state, action, reward, new state.'},
    {t:'multi',q:'Select <b>all</b> true statements about RL.',o:['The agent learns by interacting with an environment','The agent aims to maximise its cumulative reward','It learns from a fixed dataset of labelled examples','The environment tells the agent the correct action at each step'],a:[0,1],why:'No labels or correct actions are supplied.'},
    {t:'tf',q:'The agent\'s goal is to maximise its immediate reward at each individual step.',a:false,why:'It aims for total (cumulative) reward.'},
    {t:'tf',q:'An agent that only exploits what it knows may never discover a better strategy.',a:true,why:'It never tries alternatives that might beat the known one.'},
    {t:'one',q:'The agent\'s strategy for choosing an action in each state is the:',o:['Reward','Policy','State','Environment'],a:1,why:'That is the policy.'},
    {t:'order',q:'Put the agent-environment loop steps in order.',o:['The agent observes the current state','Using its policy, the agent chooses an action','The environment changes to a new state and returns a reward','The agent uses the new state and reward to adjust its strategy','The cycle repeats from the new state'],why:'Observe, act, environment responds, adjust, repeat.'}
  ],
  paper:[
    {q:'Describe the agent-environment interaction loop in reinforcement learning.',m:3,pts:['The agent observes the current state of the environment.','It chooses an action using its policy; the environment returns a new state and a reward.','The agent uses these to adjust its strategy and the cycle repeats, so it learns over many repetitions.']},
    {q:'Describe the exploration versus exploitation trade-off, and describe the principle of cumulative reward, using an example.',m:4,pts:['Exploitation: choosing an action known to give a good reward (safe).','Exploration: trying a new action which may reveal a better strategy; an agent must do both (only exploiting can get stuck, only exploring never settles).','Cumulative reward: the agent maximises total reward over the long run, not the immediate reward.','Example: a maze robot takes a longer route that avoids a dead end, accepting a small loss now for a larger total reward.']}
  ]
});

T.push({
  id:'a437',code:'A4.3.7',group:'Techniques and models',short:'Genetic algorithms',title:'Genetic algorithms',
  blurb:'Seven stages and the travelling salesperson.',
  verb:'Describe',cmd:'Describe each of the seven stages and how they map onto a real problem such as route planning.',
  ls:'Describe how genetic algorithms work and how they are applied, for example to the travelling salesperson problem.',
  lead:'A genetic algorithm borrows its method from evolution. It starts with a set of possible solutions and improves them over many generations: keep the best, combine them, add small changes. It is a <b>search and optimisation</b> technique, not a classifier or predictor.',
  hook:'Twelve cities can be visited in almost 20 million different orders. You cannot check them all. How might you evolve a good route instead?',
  stageTitle:'3D lab: evolve a route',stageSub:'Breed routes for the travelling salesperson and watch the distance fall',
  lab:{how:['On <b>Evolve a route</b>, press <b>Run</b>. The amber tour is the best route found so far. Faint tours are the rest of the population.','Try mutation rate 0 and compare it with a moderate rate.','On <b>Crossover and mutation</b>, press the buttons to see exactly what each does to a route.','On <b>The seven stages</b>, click a stage to read what happens.'],
    see:['Selection keeps short routes as parents, crossover mixes two parents, mutation makes a small random change.','The best distance falls quickly and then levels off. The result is near-optimal, not guaranteed best.','Crossover combines two parents; mutation changes a single solution. They are different steps.']},
  sections:[
    {tag:'What',h:'What genetic algorithms are for',p:'They are built for <b>optimisation problems</b>: find the best solution out of an enormous number of options, too many to check one by one. Like selective breeding: begin with a varied group, let only the best reproduce, and over many rounds the group improves. Uses: delivery routes, designing a shape that minimises drag, scheduling.'},
    {tag:'Stages',h:'The seven stages',ol:['<b>Population:</b> a set of candidate solutions, generated at random. Each member is one complete possible answer.','<b>Fitness function:</b> the rule that scores a solution; better solutions score higher.','<b>Evaluation:</b> applying the fitness function to every member of the population.','<b>Selection:</b> choosing the fittest members as parents for the next generation ("survival of the fittest").','<b>Crossover:</b> combining parts of two parent solutions to create a child that inherits from both.','<b>Mutation:</b> a small random change to a child. It keeps variety and stops the algorithm settling too early on a merely good solution.','<b>Termination:</b> the stopping rule, for example a fixed number of generations or no further improvement. The best solution found is the answer.'],p2:'The new children form the next generation and the cycle of evaluation, selection, crossover and mutation repeats until termination.'},
    {tag:'TSP',h:'Applying it: the travelling salesperson problem',p:'Given a list of cities, what is the shortest route that visits each city exactly once and returns to the start? The number of routes grows so fast that checking all is impossible.',ul:['<b>Population:</b> a set of random routes (for example 100 different orders).','<b>Fitness function:</b> 1 divided by the total distance, so a shorter route scores higher.','<b>Evaluation:</b> apply it to every route.','<b>Selection:</b> pick the shortest routes as parents.','<b>Crossover:</b> take part of one parent route and part of another to build a child.','<b>Mutation:</b> a small change such as swapping the order of two cities.','<b>Termination:</b> stop when the best route stops improving or a generation limit is reached.','A GA does not guarantee the single shortest route and does not check them all. It finds a <b>near-optimal</b> route efficiently.']}
  ],
  tables:[{h:'Summary reference',head:['Term','What it means'],rows:[
    ['Genetic algorithm','Search and optimisation technique inspired by natural selection'],['Optimisation problem','Finding the best solution among a vast number of options'],['Population','Set of candidate solutions in the current generation'],['Fitness function','Rule that scores a solution; better scores higher'],['Evaluation','Applying the fitness function to every member'],['Selection','Choosing the fittest solutions as parents'],['Crossover','Combining parts of two parents to create a child'],['Mutation','A small random change to a solution to maintain variety'],['Termination','Condition that stops the algorithm and returns the best solution'],['Travelling salesperson problem','Shortest route visiting each city once and returning to the start']]}],
  keys:[{t:'Key idea',html:'A genetic algorithm is a loop that improves a whole population over generations. Selection keeps the best, crossover combines them, mutation adds variety, and this repeats until termination. No single step does the work.'}],
  traps:['Describing a GA as a classifier or predictor. It searches for the best solution to an <b>optimisation problem</b>.','Blurring crossover and mutation. Crossover combines <b>two</b> parents into a child. Mutation makes a small random change to a <b>single</b> solution.','Claiming a GA is guaranteed to find the single best solution. It finds a near-optimal one.','Naming the stages without describing what happens at each.'],
  gloss:[['Genetic algorithm','Evolution-inspired optimisation technique.'],['Population','Candidate solutions in the current generation.'],['Fitness function','Scores how good a solution is.'],['Selection','Picks the fittest as parents.'],['Crossover','Combines two parents into a child.'],['Mutation','Small random change.'],['Termination','Stopping condition.'],['TSP','Shortest route visiting each city once, returning to start.']],
  quiz:[
    {t:'one',q:'Genetic algorithms are primarily used to solve which type of problem?',o:['Regression','Optimisation','Clustering','Classification'],a:1,why:'They search for the best solution.'},
    {t:'one',q:'Combining parts of two parent solutions to create a child is:',o:['Evaluation','Crossover','Selection','Mutation'],a:1,why:'That is crossover.'},
    {t:'one',q:'The "selection" stage is inspired by which idea?',o:['Survival of the fittest','DNA sequencing','Asexual reproduction','Random mutation'],a:0,why:'The fittest become parents.'},
    {t:'one',q:'Which problem suits a GA?',o:['Grouping customers into segments','Predicting tomorrow\'s share price','Designing the most aerodynamic car shape to minimise drag','Classifying emails as spam'],a:2,why:'Design to optimise a quantity is optimisation.'},
    {t:'one',q:'The purpose of mutation is to:',o:['Score the solutions','Introduce diversity and prevent getting stuck','Combine the best parts of parents','Ensure the fittest always survive'],a:1,why:'It keeps variety.'},
    {t:'multi',q:'Select <b>all</b> true statements about a genetic algorithm.',o:['It starts with a population of random candidate solutions','It uses a fitness function to score solutions','It is guaranteed to find the single perfect solution','It learns from a labelled training dataset'],a:[0,1],why:'It is not guaranteed optimal and uses no labelled data.'},
    {t:'tf',q:'A genetic algorithm is guaranteed to find the single best possible solution.',a:false,why:'It finds near-optimal solutions.'},
    {t:'tf',q:'Crossover combines two parents, while mutation makes a small random change to a solution.',a:true,why:'Correct.'},
    {t:'one',q:'In the travelling salesperson problem, a sensible fitness function is:',o:['The number of cities','1 divided by the total route distance','The route length itself, larger is better','A random number'],a:1,why:'Shorter route, higher fitness.'},
    {t:'order',q:'Put the stages of a GA in order.',o:['Create an initial population of random solutions','Evaluate each solution using the fitness function','Select the fittest solutions as parents','Apply crossover to create children','Apply mutation to the children','Repeat until the termination condition is met'],why:'Population, evaluate, select, crossover, mutate, repeat.'}
  ],
  paper:[
    {q:'Describe how the selection, crossover and mutation stages of a genetic algorithm work together to produce a new generation.',m:3,pts:['Selection chooses the fittest solutions as parents.','Crossover combines parts of two parents to create a child.','Mutation makes a small random change to a child to keep variety; the children form the next generation.']},
    {q:'Describe how a genetic algorithm could be applied to the travelling salesperson problem.',m:4,pts:['Population: random routes through the cities.','Fitness function such as 1 / total distance; evaluate every route.','Selection of the shortest routes as parents; crossover builds a child from parts of two parents; mutation swaps two cities.','Repeat over generations until termination (best route stops improving or a generation limit).']}
  ]
});

T.push({

  ls:'Outline the structure and function of artificial neural networks: the perceptron and the multi-layer perceptron.',
  lead:'An artificial neural network (ANN) takes its design from the brain. It is built from many simple units called <b>neurons</b> wired together so data flows through them, and it learns patterns from examples rather than fixed rules. You do not need the maths of how weights are trained.',
  hook:'A single neuron can only draw one straight line. How can many of them together recognise a pattern that no straight line can separate?',

  sections:[
    {tag:'ANN',h:'What an ANN is and does',p:'A machine learning model of many interconnected <b>neurons</b> (nodes), loosely modelled on nerve cells passing signals. It processes examples and learns the patterns in them instead of following rules written by a programmer. Once trained it can do <b>classification</b>, <b>regression</b> and <b>pattern recognition</b>. ANNs are the technology behind deep learning.'},
    {tag:'Neuron',h:'The perceptron: a single neuron',p:'The simplest ANN is one neuron, the building block of larger networks. It takes several inputs, combines them and gives one output.',ul:['<b>Inputs:</b> the features of the data (hours studied, previous score).','<b>Weights:</b> each input is multiplied by a weight that sets how much influence it has. The network learns the weights from data.','<b>Bias:</b> an extra adjustable value added to the total, shifting the point at which the neuron responds.','<b>Summation:</b> the neuron adds the weighted inputs and the bias.','<b>Activation function:</b> decides the neuron\'s final response from the total.','<b>Output:</b> the result, which might be a category or a number.','A single perceptron can only separate patterns simple enough to divide with one straight line.']},
    {tag:'Steps',h:'The signal path through one perceptron',ol:['Receive the inputs.','Multiply each input by its weight.','Add the weighted inputs together with the bias.','Pass the total through the activation function.','Produce the output.']},
    {tag:'MLP',h:'The multi-layer perceptron',p:'An MLP connects many neurons into layers. It is the most common form of ANN.',ul:['<b>Input layer:</b> receives the raw data, one neuron per feature.','<b>Hidden layer(s):</b> in the middle; combine simple signals into more complex ones. There may be one or more.','<b>Output layer:</b> produces the final result; the number of neurons depends on the task.','A single neuron makes only a simple straight-line split. Hidden-layer neurons combine many such decisions, so the network captures the complex, <b>non-linear</b> patterns in real data.','This layered structure is the foundation of modern deep learning.']}
  ],
  tables:[{h:'Summary reference',head:['Term','What it means'],rows:[
    ['Artificial neural network','Model of interconnected neurons that learns patterns from data'],['Neuron (node)','A single processing unit'],['Perceptron','A single artificial neuron; building block of an ANN'],['Input','A feature of the data fed into a neuron'],['Weight','Sets how much influence an input has'],['Bias','Extra adjustable value added to the total, shifting the response'],['Activation function','Decides the neuron\'s output from its total'],['Output','The final result of the neuron or network'],['Input layer','Receives raw data, one neuron per feature'],['Hidden layer','Middle layer where complex patterns are combined'],['Output layer','Final layer that produces the result'],['Multi-layer perceptron (MLP)','ANN arranged in input, hidden and output layers']]}],
  keys:[{t:'Key idea',html:'An MLP is neurons arranged in an input layer, one or more hidden layers and an output layer. The hidden layers give the network its ability to model complex, non-linear patterns.'}],
  traps:['Confusing weight and bias. A weight scales <b>one input</b>. The bias is a single extra value added to the total. In a sketch, show weights on the input connections and the bias entering the neuron separately.','Forgetting the activation function. Sum then activation then output.','Saying a single perceptron can solve any problem. It can only draw a single straight-line split.'],
  gloss:[['ANN','Network of connected neurons that learns from data.'],['Perceptron','A single artificial neuron.'],['Weight','Influence of an input.'],['Bias','Extra value that shifts the response.'],['Activation function','Turns the total into the neuron output.'],['Input layer','One neuron per feature.'],['Hidden layer','Combines signals into complex features.'],['Output layer','Gives the final result.'],['MLP','Multi-layer perceptron.']],
  quiz:[
    {t:'one',q:'An ANN is a machine learning model inspired by:',o:['Natural selection','The laws of physics','Formal logic','The structure and function of the human brain'],a:3,why:'It is loosely modelled on nerve cells.'},

T.push({
  id:'a439',code:'A4.3.9',group:'Techniques and models',short:'Convolutional neural networks',title:'Convolutional neural networks',
  blurb:'Kernels, pooling and spatial hierarchies.',
  verb:'Describe',cmd:'Describe how a CNN builds features from simple to complex, what each layer does, and what the main design choices change. You do not need the convolution maths.',
  ls:'Describe how CNNs are designed to adaptively learn spatial hierarchies of features in images.',
  lead:'A CNN is the neural network built for <b>images</b>. A standard MLP must flatten an image into one line of pixels, which throws away the arrangement of the picture. A CNN keeps the two-dimensional layout and looks at small groups of neighbouring pixels, building features from small details up to whole objects.',
  hook:'Flatten a picture of a cat into one long line of numbers. Pixels that were neighbours and formed an ear are now far apart. What has the network lost?',
  stageTitle:'3D lab: look inside a CNN',stageSub:'Slide a kernel, pool a feature map, and follow the whole pipeline',
  lab:{how:['On <b>Convolution</b>, pick a kernel and press <b>Slide</b>. Or drag the position slider to move the kernel by hand.','Switch on ReLU and then pooling to see the feature map shrink.','On <b>Parameters</b>, change kernel size and stride and read the feature map size.','On <b>Whole pipeline</b>, press <b>Send an image</b> and follow it layer by layer.'],
    see:['A kernel is a small matrix of weights that slides over the image. High values in the feature map show where its feature was found.','Convolution detects features. Pooling only shrinks the maps.','Early layers learn edges, middle layers shapes, deep layers object parts.']},
  sections:[
    {tag:'Why',h:'Why images need a different approach',p:'An MLP takes a flat list of numbers. Flattening a 2D grid of pixels breaks the spatial arrangement: pixels that were neighbours and together made an edge or shape are no longer next to each other. A CNN keeps the image as a 2D grid and looks at small neighbouring groups of pixels, so spatial relationships can be learned.'},
    {tag:'Hierarchy',h:'The spatial hierarchy of features',p:'A CNN recognises an image by building features of increasing complexity, not pixel by pixel. "Adaptively" means the network is not told what to look for; it learns the features that best identify the images during training.',ul:['<b>Low-level features</b> (earliest layers): edges, lines, patches of colour.','<b>Mid-level features:</b> corners, curves, textures.','<b>High-level features</b> (deeper layers): recognisable parts such as an eye, an ear or a wheel.','The final layers weigh the evidence and produce a classification.']},
    {tag:'Layers',h:'The architecture, in order',ol:['<b>Input layer:</b> holds the raw image as a grid of pixel values (for example 28 by 28).','<b>Convolutional layers:</b> the core. Each applies a <b>kernel</b> (a small matrix of weights such as 3 by 3) that slides across the image and responds where it finds its feature, producing a <b>feature map</b>. The kernel values are learned during training.','<b>Activation function</b> (for example ReLU) after each convolution adds <b>non-linearity</b>, so the network can learn patterns more complex than straight-line relationships.','<b>Pooling layers:</b> down-sample the feature maps, keeping important information while shrinking the data. This makes the network faster and less sensitive to the exact position of a feature. <b>Max pooling</b> keeps only the largest value in each patch.','After several convolution and pooling stages the final maps are <b>flattened</b> into a line.','<b>Fully connected layers:</b> work like an MLP and weigh up the high-level features to decide.','<b>Output layer:</b> typically one neuron per class giving a probability; the class with the highest value is the answer.']},
    {tag:'Parameters',h:'The effect of key parameters',ul:['<b>Number of layers:</b> sets how deep the hierarchy can go. Shallow networks learn simple features like edges. Deeper networks can learn complex features such as faces.','<b>Kernel size</b> (3 by 3, 5 by 5): a smaller kernel picks up fine local detail; a larger one responds to broader, more general patterns.','<b>Stride:</b> how many pixels the kernel moves each step. A larger stride gives a smaller feature map and faster computation but captures less detail.','<b>Activation function:</b> affects how the network learns and how fast it trains. ReLU is the common choice.','<b>Loss function:</b> measures how wrong the prediction is compared with the correct label during training (for example cross-entropy for classification). It shapes what the network tries to get right.','These choices trade detail against efficiency.']}
  ],
  tables:[{h:'Summary reference',head:['Term','What it means'],rows:[
    ['Spatial hierarchy of features','Recognition built from simple features (edges) up to complex ones (object parts)'],['Input layer','Holds the raw image as a grid of pixel values'],['Convolutional layer','Applies kernels to detect features, producing feature maps'],['Kernel (filter)','Small matrix of weights that slides over the image to detect a feature'],['Feature map','Output of a convolution showing where a feature was found'],['Activation function','Applied after convolution to add non-linearity (for example ReLU)'],['Pooling layer','Down-samples feature maps to shrink data (for example max pooling)'],['Fully connected layers','Flattened features weighed up to make the classification'],['Output layer','Final result: a probability for each class'],['Number of layers','Sets how deep and complex the feature hierarchy can be'],['Kernel size and stride','Filter size and step; affect detail captured and speed'],['Loss function','Measures how wrong a prediction is during training (for example cross-entropy)']]}],
  keys:[{t:'Key idea',html:'An MLP flattens an image and loses its structure. A CNN keeps the 2D layout, works on small local regions, and learns a hierarchy: edges, then shapes, then object parts.'}],
  traps:['Mixing up the jobs of convolution and pooling. Convolution detects features with a kernel and produces feature maps. Pooling only shrinks the maps by down-sampling.','Saying the kernel values are set by hand. They are learned during training.','Listing the layers without describing each one\'s role.','Believing a bigger stride keeps more detail. It gives a smaller map and less detail.'],
  gloss:[['CNN','Neural network built for images.'],['Kernel','Small weight matrix that slides over the image.'],['Feature map','Output of a convolution.'],['ReLU','Common activation function: negatives become zero.'],['Pooling','Down-sampling of feature maps.'],['Max pooling','Keeps the largest value in each patch.'],['Stride','Pixels the kernel moves per step.'],['Fully connected layer','MLP-style layer that makes the decision.'],['Loss function','Measures how wrong a prediction is.']],
  quiz:[
    {t:'one',q:'What is the main advantage of a CNN over a standard MLP for image recognition?',o:['It preserves the spatial hierarchy of features in an image','It needs less data','It can only do classification','It is always faster'],a:0,why:'It keeps the 2D layout and learns local features.'},
    {t:'one',q:'The small matrix of weights that slides over an image to detect features is the:',o:['Feature map','Stride','Pooling layer','Kernel (filter)'],a:3,why:'Kernel.'},
    {t:'one',q:'The primary purpose of a pooling layer is to:',o:['Down-sample feature maps to reduce computation','Make the final classification','Introduce non-linearity','Detect complex features such as eyes'],a:0,why:'Pooling shrinks the data.'},
    {t:'one',q:'The parameter controlling how many pixels the kernel moves each step is the:',o:['Kernel size','Loss function','Stride','Pooling size'],a:2,why:'Stride.'},
    {t:'one',q:'The function that measures how wrong a prediction is during training is the:',o:['Loss function','Pooling function','Kernel function','Activation function'],a:0,why:'Loss function.'},
    {t:'multi',q:'Select <b>all</b> correct statements about how a CNN processes an image.',o:['Convolutional layers use kernels to detect features','Pooling layers down-sample the feature maps','The raw image is flattened before any convolution','The output layer is where edges are first detected'],a:[0,1],why:'Flattening comes after the convolution and pooling stages.'},
    {t:'tf',q:'A CNN learns the values in its kernels during training rather than having them set by hand.',a:true,why:'That is what "adaptively" means.'},
    {t:'tf',q:'A deeper CNN, with more convolutional layers, can learn a more complex hierarchy of features.',a:true,why:'More layers, more abstraction.'},
    {t:'one',q:'In a CNN, early layers learn ___ features and deeper layers combine them into ___ features.',o:['simple, complex','complex, simple','random, fixed','pooled, flattened'],a:0,why:'Edges first, then parts.'},
    {t:'order',q:'Put the stages an image passes through in a CNN in order.',o:['The input layer holds the raw pixels','A convolutional layer detects features using kernels','An activation function adds non-linearity','A pooling layer down-samples the feature maps','Fully connected layers weigh up the features','The output layer gives the class probabilities'],why:'Input, convolution, activation, pooling, fully connected, output.'}
  ],
  paper:[
    {q:'Describe how a CNN learns a spatial hierarchy of features from an image.',m:3,pts:['Early layers learn low-level features such as edges, lines and colour patches.','Middle layers combine them into mid-level features (corners, curves, textures); deeper layers into high-level parts (an eye, a wheel).','The features are learned adaptively during training, not specified by hand, and the final layers classify.']},
    {q:'Describe the basic architecture of a CNN, naming in order the layers an image passes through from input to classification.',m:4,pts:['Input layer holds the raw pixel grid.','Convolutional layers with kernels produce feature maps; an activation function (ReLU) adds non-linearity.','Pooling layers down-sample the maps; the final maps are flattened.','Fully connected layers weigh up the features and the output layer gives class probabilities.']}
  ]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ML Lab 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: left syllabus rail + one long study page per topic. Each page opens with a dark 3D lab (the "instrument"), then notes, traps, quiz and paper practice. */
:root{
  --bg:#F1F4F8; --sf:#FFFFFF; --sf2:#E6EBF2; --ink:#0F1A26; --mut:#4F6077; --line:#D2DAE4;
  --acc:#0B7F7C; --acc-soft:#DCF1EF; --on-acc:#FFFFFF; --amber:#8A5A00; --amber-soft:#FBEFD2;
  --good:#12784A; --good-soft:#DDF3E8; --bad:#B3243B; --bad-soft:#FBE3E7; --hh:54px;
  --f-d:'Familjen Grotesk','IBM Plex Sans',system-ui,sans-serif;
  --f-b:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-m:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09111A; --sf:#111B27; --sf2:#1A2837; --ink:#E4ECF4; --mut:#93A5B9; --line:#243649;
  --acc:#3DD6C6; --acc-soft:#10342F; --on-acc:#04211E; --amber:#FFC233; --amber-soft:#3A2D0B;
  --good:#52DA9F; --good-soft:#0F3324; --bad:#FF8093; --bad-soft:#3F1620; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09111A; --sf:#111B27; --sf2:#1A2837; --ink:#E4ECF4; --mut:#93A5B9; --line:#243649;
  --acc:#3DD6C6; --acc-soft:#10342F; --on-acc:#04211E; --amber:#FFC233; --amber-soft:#3A2D0B;
  --good:#52DA9F; --good-soft:#0F3324; --bad:#FF8093; --bad-soft:#3F1620; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-b);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:60}
h1,h2,h3{font-family:var(--f-d);text-wrap:balance;margin:0;letter-spacing:-.01em;line-height:1.15}
p{margin:0 0 .8em}
a{color:var(--acc)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
code,.mono{font-family:var(--f-m);font-size:.92em}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--hh);background:var(--sf);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-d);font-weight:700;font-size:1.15rem;letter-spacing:-.02em;color:var(--ink);text-decoration:none;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand small{font:500 .72rem var(--f-m);color:var(--mut);letter-spacing:.04em}
.bar .sp{flex:1}
.prog{display:flex;align-items:center;gap:8px;font:500 .76rem var(--f-m);color:var(--mut)}
.prog i{display:block;width:90px;height:6px;border-radius:99px;background:var(--sf2);overflow:hidden}
.prog i b{display:block;height:100%;background:var(--acc);width:0}
.ib{border:1px solid var(--line);background:var(--sf2);color:var(--ink);border-radius:8px;height:34px;padding:0 11px;font:600 .8rem var(--f-b);cursor:pointer}
.ib:hover{border-color:var(--acc)}
#menu{display:none}
.app{display:grid;grid-template-columns:276px minmax(0,1fr)}
.side{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - var(--hh) - env(safe-area-inset-top,0px));overflow:auto;
  background:var(--sf);border-right:1px solid var(--line);padding:16px 12px 40px max(16px,env(safe-area-inset-left,0px))}
.side h4{margin:18px 0 6px;font:600 .68rem var(--f-m);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.side h4:first-child{margin-top:0}
.side a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:.88rem;line-height:1.3}
.side a:hover{background:var(--sf2)}
.side a[aria-current="page"]{background:var(--acc-soft);font-weight:600}
.side a .c{font:500 .72rem var(--f-m);color:var(--mut);min-width:46px}
.side a .d{margin-left:auto;font:500 .7rem var(--f-m);color:var(--good)}
.main{min-width:0;padding:28px max(16px,env(safe-area-inset-right,0px)) 80px max(24px,env(safe-area-inset-left,0px))}
.page{max-width:1020px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.crumb{font:500 .74rem var(--f-m);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
h1{font-size:clamp(1.9rem,4.6vw,3rem);font-weight:700;margin:6px 0 10px}
h2{font-size:1.4rem;font-weight:600;margin-bottom:12px}
h3{font-size:1.05rem;font-weight:600;margin-bottom:6px}
.ls{font-size:1.05rem;color:var(--mut);max-width:68ch}
.cmdrow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;margin-top:14px}
.cmd{display:flex;gap:10px;align-items:baseline;border:1px solid var(--line);border-radius:10px;background:var(--sf);padding:10px 14px;max-width:100%}
.cmd b{font:600 .72rem var(--f-m);letter-spacing:.09em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:5px;white-space:nowrap}
.cmd span{font-size:.9rem;min-width:0}
.lead{font-size:1.08rem;max-width:70ch}
.think{border:1px dashed var(--acc);border-radius:10px;padding:12px 16px;background:var(--acc-soft);max-width:70ch}
.think b{font:600 .7rem var(--f-m);letter-spacing:.09em;text-transform:uppercase;display:block;margin-bottom:4px;color:var(--acc)}
.stage{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--sf)}
.stage-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:12px 16px 10px}
.stage-h h2{font-size:1.15rem;margin:0}
.stage-h span{font-size:.82rem;color:var(--mut)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:6px 10px;background:var(--sf2);border-block:1px solid var(--line)}
.tab{border:0;background:transparent;color:var(--mut);font:600 .82rem var(--f-b);padding:7px 12px;border-radius:7px;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--sf);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.vp{position:relative;height:clamp(330px,58vh,600px);background:#0B1520;touch-action:pan-y;cursor:grab}
.vp:active{cursor:grabbing}
.vp canvas{display:block;width:100%;height:100%}
.vp .zm{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.vp .zm button{width:32px;height:32px;border-radius:8px;border:1px solid #2b3c50;background:#14212f;color:#dfeaf5;font:600 15px var(--f-b);cursor:pointer}
.vp .zm button:hover{border-color:#3DD6C6}
.vp .hint{position:absolute;left:12px;bottom:10px;font:500 .72rem var(--f-m);color:#7f93a8;pointer-events:none;max-width:70%}
.vp .fail{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#cbd9e6}
.ctrl{display:flex;flex-wrap:wrap;gap:12px 18px;padding:14px 16px;align-items:flex-end;border-top:1px solid var(--line)}
.ctrl:empty{display:none}
.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;min-width:0}
.grp>legend,.grp>.lg{width:100%;font:600 .68rem var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.btn{border:1px solid var(--line);background:var(--sf2);color:var(--ink);border-radius:8px;padding:8px 13px;font:600 .82rem var(--f-b);cursor:pointer;text-align:left}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:transparent}
.btn[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.sl{display:flex;flex-direction:column;gap:2px;min-width:150px;flex:1 1 170px;max-width:280px}
.sl span{font-size:.78rem;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.sl b{font:500 .8rem var(--f-m);color:var(--ink)}
.sl input{width:100%;accent-color:var(--acc);margin:4px 0}
.ck{display:flex;gap:7px;align-items:center;font-size:.84rem;cursor:pointer}
.ck input{accent-color:var(--acc);width:16px;height:16px}
.readout{padding:14px 16px;border-top:1px solid var(--line);font-size:.9rem;background:var(--sf);min-height:64px}
.readout .row{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:6px}
.readout .k{font:500 .68rem var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:block}
.readout .v{font:500 1.05rem var(--f-m);font-variant-numeric:tabular-nums}
.readout .v.g{color:var(--good)} .readout .v.b{color:var(--bad)} .readout .v.a{color:var(--amber)}
.readout p{margin:.3em 0;max-width:80ch}
.tip{font-size:.84rem;color:var(--mut);padding:0 16px 14px;max-width:90ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:10px;background:var(--sf);padding:16px 18px;min-width:0}
.card h3{display:flex;gap:8px;align-items:baseline}
.card ul,.card ol{margin:.3em 0 .6em;padding-left:1.15em}
.card li{margin:.25em 0}
.card.eg{background:var(--sf2);border-style:dashed}
.tag{display:inline-block;font:600 .66rem var(--f-m);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--acc-soft);color:var(--acc);margin-right:6px;vertical-align:1px}
.trap{border:1px solid var(--bad);border-radius:10px;background:var(--bad-soft);padding:12px 16px}
.trap b.t{font:600 .68rem var(--f-m);letter-spacing:.09em;text-transform:uppercase;color:var(--bad);display:block;margin-bottom:3px}
.key{border:1px solid var(--amber);border-radius:10px;background:var(--amber-soft);padding:12px 16px}
.key b.t{font:600 .68rem var(--f-m);letter-spacing:.09em;text-transform:uppercase;color:var(--amber);display:block;margin-bottom:3px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--sf)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .7rem var(--f-m);letter-spacing:.07em;text-transform:uppercase;color:var(--mut);background:var(--sf2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
.sec>h2{display:flex;align-items:baseline;gap:10px}
.sec>h2 small{font:500 .74rem var(--f-m);color:var(--mut)}
.q{border:1px solid var(--line);border-radius:10px;background:var(--sf);padding:16px 18px;margin-bottom:12px}
.q .qt{font-weight:600;margin-bottom:10px}
.q .qn{font:500 .72rem var(--f-m);color:var(--mut);display:block;margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{border:1px solid var(--line);background:var(--sf2);color:var(--ink);border-radius:8px;padding:9px 12px;text-align:left;font-size:.9rem;cursor:pointer;display:flex;gap:10px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .l{font:600 .78rem var(--f-m);color:var(--mut);min-width:1.2em}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{margin-top:10px;font-size:.88rem;padding:10px 12px;border-radius:8px;background:var(--sf2)}
.why b{font-weight:600}
.score{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--sf)}
.score .n{font:700 1.7rem var(--f-d)}
.ord{display:flex;flex-direction:column;gap:8px}
.ord .pool,.ord .ans{display:flex;flex-wrap:wrap;gap:7px}
.ord .ans{min-height:44px;border:1px dashed var(--line);border-radius:8px;padding:7px;counter-reset:s}
.ord .ans .opt::before{counter-increment:s;content:counter(s);font:600 .78rem var(--f-m);color:var(--acc)}
.paper{border:1px solid var(--line);border-radius:10px;background:var(--sf);padding:16px 18px;margin-bottom:12px}
.paper textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:10px;font:inherit;resize:vertical;margin:8px 0}
.paper .pts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.paper .m{font:600 .72rem var(--f-m);color:var(--mut)}
.nav2{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nav2 a{flex:1 1 220px;border:1px solid var(--line);border-radius:10px;background:var(--sf);padding:12px 16px;text-decoration:none;color:var(--ink)}
.nav2 a:hover{border-color:var(--acc)}
.nav2 small{display:block;font:500 .7rem var(--f-m);color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.nav2 a:last-child{text-align:right}
.home-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
.home-hero .vp{height:clamp(300px,46vh,440px);border-radius:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;background:var(--sf);padding:14px 16px;text-decoration:none;color:var(--ink);min-width:0}
.tile:hover{border-color:var(--acc)}
.tile .c{font:500 .72rem var(--f-m);color:var(--acc)}
.tile b{font-family:var(--f-d);font-size:1.05rem;line-height:1.2}
.tile span{font-size:.82rem;color:var(--mut)}
.tile .d{font:500 .72rem var(--f-m);color:var(--good)}
.scrim{display:none}
@media (max-width:900px){
  #menu{display:inline-block}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:calc(var(--hh) + env(safe-area-inset-top,0px));bottom:0;height:auto;width:min(86vw,330px);z-index:45;transform:translateX(-102%);transition:transform .2s}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .home-hero{grid-template-columns:minmax(0,1fr)}
  .prog i{display:none}
  .brand small{display:none}
  .bar{gap:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  #theme{padding:0 8px;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="bar">
  <button class="ib" id="menu" aria-label="Open topic list">Topics</button>
  <a class="brand" href="#home">ML Lab 3D <small>IB CS · OPTION A4</small></a>
  <div class="sp"></div>
  <div class="prog" id="prog"><i><b></b></i><span></span></div>
  <button class="ib" id="theme" aria-label="Change theme">Theme: system</button>
</header>
<div class="app">
  <nav class="side" id="side" aria-label="Topics"></nav>
  <main class="main" id="main"></main>
</div>
<div class="scrim" id="scrim"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ---------- tiny helpers ---------- */
const T=[];            // topics
const SC={};           // scene factories by topic id
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
function h(tag,attrs,...kids){

const C={teal:0x2ec4b6,amber:0xffb400,coral:0xff5d73,violet:0x8c7bff,sky:0x4cc9f0,white:0xe8f1f8,mut:0x6b8299,dim:0x24384c,ink:0x0b1520,lime:0xa6e22e};
const HEX=n=>'#'+n.toString(16).padStart(6,'0');
const CLS=[C.teal,C.amber,C.coral,C.violet,C.sky,C.lime];

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

const store={m:{},get(k,d){try{const v=localStorage.getItem('mllab3d.'+k);return v==null?(k in this.m?this.m[k]:d):JSON.parse(v);}catch(e){return k in this.m?this.m[k]:d;}},
  set(k,v){this.m[k]=v;try{localStorage.setItem('mllab3d.'+k,JSON.stringify(v));}catch(e){}}};
/* readout builder: kv([[label,value,cls]...]) */
const kv=a=>'<div class="row">'+a.map(x=>'<div><span class="k">'+x[0]+'</span><span class="v '+(x[2]||'')+'">'+x[1]+'</span></div>').join('')+'</div>';

/* ---------- Stage: renderer + orbit + helpers ---------- */
class Stage{
  constructor(vp,tabsEl,ctrlEl,outEl,tipEl,opt){
    opt=opt||{};this.vp=vp;this.tabsEl=tabsEl;this.dead=false;this.vis=true;this.time=0;

    this.G={sph:new THREE.SphereGeometry(1,18,12),sph8:new THREE.SphereGeometry(1,10,8),box:new THREE.BoxGeometry(1,1,1),cyl:new THREE.CylinderGeometry(1,1,1,10,1),cone:new THREE.ConeGeometry(1,1,12),pln:new THREE.PlaneGeometry(1,1),tor:new THREE.TorusGeometry(1,.08,8,40)};

    const zm=h('div',{class:'zm'},
      h('button',{title:'Zoom in','aria-label':'Zoom in',onclick:()=>this.zoom(.85)},'+'),

function polyfit(xs,ys,d){const n=d+1;const A=[];for(let i=0;i<n;i++){A.push(new Array(n+1).fill(0));}

  const c=new Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=A[i][n];for(let j=i+1;j<n;j++)s-=A[i][j]*c[j];c[i]=s/A[i][i];}return c;}

 {label:'Wrapper',view:[17,.7,1.0,[0,3,0]],hint:'Press Step to run one round of the search.',tip:'Five feature spheres at the front. Towers behind show the model score after each round. Every candidate subset needs a model trained, which is the cost.',

 {label:'Embedded (Lasso)',view:[16,.65,1.0,[0,3,0]],hint:'Raise the penalty and watch coefficients hit zero.',tip:'Bars are regression coefficients. The Lasso (L1) penalty shrinks each one by lambda and clips at zero. A coefficient of exactly zero means the feature is removed.',

SC.a434=function(S){

 {label:'k-means step by step',view:[18,.7,1.1,[0,3,0]],hint:'Step: assign, then move. Repeat until still.',tip:'Small spheres are data points. Cubes are centroids. Press Step to alternate assign and move.',
  build(g,u){

SC.a435=function(S){

 const mk=()=>{const r=rng(24);const B=[];for(let i=0;i<48;i++){const s=new Set();if(r()<.6){s.add(0);if(r()<.7){s.add(1);if(r()<.8)s.add(2);if(r()<.45)s.add(6);}else if(r()<.3)s.add(2);}else{if(r()<.3)s.add(2);if(r()<.2)s.add(1);}

 S.modes([
 {label:'Baskets and rules',view:[19,.8,1.0,[0,1,0]],hint:'Choose the if-items and the then-item.',tip:'Each pad is one shopping basket and each small cube is an item. Pads containing the antecedent rise. Pads containing the whole rule rise highest and glow amber.',

   const ante=new Set([0]);let cons=2;

     pads.forEach(o=>{const ha=[...ante].every(x=>o.b.has(x)),hb=ha&&o.b.has(cons);o.pad.material=S.mat(hb?C.amber:ha?0x4a7a8a:0x24384c,{emi:hb?.7:0});const h=hb?1.0:ha?.55:.2;o.pad.scale.y=h;o.pad.position.y=h/2;});

 {label:'Rule explorer',view:[17,.75,1.0,[0,2,0]],hint:'Each sphere is a rule. Raise the filters.',tip:'Every one-item rule is a sphere placed by support (x) and confidence (z). Only rules above both thresholds (the green zone) are worth acting on. Click a sphere to read the rule.',

SC.a436=function(S){
 S.modes([
 {label:'Maze learner',view:[17,.62,1.0,[0,0,0]],hint:'Train, then send the robot.',tip:'Grey blocks are walls. The amber cell is the goal (+1), the coral cell is a pit (-1). Every step costs a little. Green arrows show the policy the agent has learned so far; taller tiles have a higher learned value.',
  build(g,u){

     if(wall.has(k)){S.cube(g,[p[0],.7,p[2]],[SZ*.92,1.4,SZ*.92],0x4a6a8a);tiles.push(null);continue;}
     const col=(cy*W+cx)===GOAL?C.amber:k===pit?C.coral:0x24384c;
     tiles.push(S.cube(g,[p[0],.08,p[2]],[SZ*.92,.16,SZ*.92],col,{emi:col===0x24384c?0:.5}));}
   S.label(g,'Start',[P(0,0)[0],1.2,P(0,0)[2]],{size:.5,color:'#52da9f'});S.label(g,'Goal +1',[P(5,5)[0],1.4,P(5,5)[2]],{size:.5,color:'#ffb400'});S.label(g,'Pit -1',[P(4,1)[0],1.4,P(4,1)[2]],{size:.5,color:'#ff8093'});
   const robot=S.ball(g,[P(0,0)[0],.7,P(0,0)[2]],.4,C.white,{emi:.4});
   let gp=null,eps=.3,episodes=0,lastR=0,busy=false;
   const DX=[0,1,0,-1],DY=[-1,0,1,0];
   const step=(s,a)=>{const cx=s%W,cy=Math.floor(s/W),nx=cx+DX[a],ny=cy+DY[a];
     if(nx<0||ny<0||nx>=W||ny>=W||wall.has(nx+','+ny))return{ns:s,r:-.1,d:false};
     const ns=ny*W+nx;if(ns===GOAL)return{ns,r:1,d:true};if(nx+','+ny===pit)return{ns,r:-1,d:true};return{ns,r:-.04,d:false};};
   const best=s=>{let b=0;for(let a=1;a<4;a++)if(Q[s*4+a]>Q[s*4+b]+1e-9)b=a;return b;};
   const mx=s=>Math.max(Q[s*4],Q[s*4+1],Q[s*4+2],Q[s*4+3]);
   const episode=()=>{let s=0,tot=0;for(let t=0;t<80;t++){const a=rr()<eps?Math.floor(rr()*4):best(s);const o=step(s,a);
       Q[s*4+a]+=.5*(o.r+.95*(o.d?0:mx(o.ns))-Q[s*4+a]);s=o.ns;tot+=o.r;if(o.d)break;}episodes++;lastR=tot;};

   const draw=()=>{if(gp)g.remove(gp);gp=new THREE.Group();g.add(gp);
     for(let s=0;s<W*W;s++){const cx=s%W,cy=Math.floor(s/W);if(wall.has(cx+','+cy)||s===GOAL||(cx+','+cy)===pit)continue;
       const m=mx(s);const t=tiles[s];if(t){const hh=.16+Math.max(0,m)*.9;t.scale.y=hh;t.position.y=hh/2;}

 const ox=(p1,p2,i,j)=>{const ch=new Array(p1.length).fill(-1);for(let k=i;k<=j;k++)ch[k]=p1[k];let pos=(j+1)%p1.length;for(let k=0;k<p2.length;k++){const v=p2[(j+1+k)%p2.length];if(!ch.includes(v)){ch[pos]=v;pos=(pos+1)%p1.length;}}return ch;};
 S.modes([
 {label:'Evolve a route',view:[20,.62,1.0,[0,0,-2]],hint:'Run, then compare with mutation 0.',tip:'Spheres are cities (the green square is home). The amber tour is the best route found so far, raised above the board. Faint tours are other members of the population. The towers at the back show the best distance falling.',

     pop.sort((a,b)=>tlen(cities,a)-tlen(cities,b));bestD=tlen(cities,pop[0]);best0=bestD;hist=[bestD];
     g.remove(cityObjs);cityObjs.clear&&cityObjs.clear();while(cityObjs.children.length)cityObjs.remove(cityObjs.children[0]);g.add(cityObjs);

     lines.forEach((l,i)=>{const t=pop[6+i*5<POP?6+i*5:POP-1];S.setLine(l,loop(t).map(p=>[p[0],.15,p[2]]));});
     const mxd=hist[0];towers.forEach((t,i)=>{const d=hist[Math.min(hist.length-1,i*2)];setH(t,i*2<=gen?d/mxd*3.2:.05);});
     const imp=(1-bestD/best0)*100;
     u.out(kv([['Generation',gen+' / '+GMAX],['Best distance',fx(bestD*40,0)+' km','g'],['Random start',fx(best0*40,0)+' km'],['Improvement',fx(imp,0)+'%',imp>20?'g':'a'],['Mutation rate',Math.round(mut*100)+'%']])+'<p>'+(done?'<b>Termination:</b> the generation limit or lack of improvement stopped the run. The result is a near-optimal route, not a guaranteed best. Twelve cities have almost 20 million possible orders and the GA checked only a few thousand.':'Each generation: <b>selection</b> keeps short routes as parents, <b>crossover</b> mixes two parents, <b>mutation</b> swaps two cities in a child. Fitness = 1 / distance.')+'</p>');};

 {label:'Multi-layer perceptron',view:[26,.6,1.05,[0,3.2,0]],hint:'Move inputs, then press Send signal.',tip:'Input layer, two hidden layers and an output layer. Teal connections are positive weights, coral are negative. Neurons glow with their activation. Press Send signal to watch the layers fire in turn.',

 {label:'XOR challenge',view:[17,.9,1.0,[0,0,0]],hint:'Try to separate teal from coral.',tip:'Four inputs (x1, x2). Teal spheres should output 1, coral spheres 0 (XOR: 1 only when exactly one input is 1). The floor shows what the model predicts everywhere: teal tiles = 1, coral tiles = 0.',

SC.a4310=function(S){
 S.modes([
 {label:'No single best model',view:[20,.62,1.05,[0,3,0]],hint:'Click a problem to compare the models.',tip:'Illustrative scores (not measured) for how well three model types might do on four problems. Teal: linear regression. Amber: decision tree. Violet: neural network. The best choice changes with the problem.',
  build(g,u){
   S.floor(g,26,26,0);
   const P=['House prices','Image recognition','Loan decisions','Weather patterns'],M=['Linear regression','Decision tree','Neural network'],MC=[C.teal,C.amber,C.violet];
   const SCR=[[88,74,79],[31,52,95],[76,80,85],[45,68,84]];const PICK=[0,2,1,2];
   const WHY=['Prices rise roughly in a straight line with size and the dataset is small. <b>Linear regression</b> captures it well and is easy to explain. A neural network adds complexity without gain.','Pixels form spatial patterns no straight line or short rule list can capture. A deep network (a CNN) learns the feature hierarchy, given plenty of data. <b>Neural network.</b>','The neural network scores highest, but the dataset is small and each refusal must be explained to the customer. The <b>decision tree</b> is almost as accurate and is a white box. Interpretability outweighs a little accuracy.','Weather depends on many interacting non-linear factors and there is lots of data. The flexible <b>neural network</b> wins; a straight line cannot capture it.'];
   const tw2=[];P.forEach((pn,pi)=>{S.label(g,pn,[(pi-1.5)*5.4,-.9,2.8],{size:.55});SCR[pi].forEach((s,mi)=>{const m=tw(S,g,(pi-1.5)*5.4+(mi-1)*1.35,0,s/100*7,MC[mi],1.15);m.userData={pi,mi,c:MC[mi]};tw2.push(m);S.label(g,String(s),[(pi-1.5)*5.4+(mi-1)*1.35,s/100*7+.7,0],{size:.45,color:'#ffffff'});});});
   const star=S.label(g,'★ best choice',[0,-99,0],{size:.55,color:'#ffb400'});
   const sel=pi=>{tw2.forEach(m=>m.material=S.mat(m.userData.c,{emi:pi==null||m.userData.pi===pi?.35:0,op:pi==null||m.userData.pi===pi?1:.3}));
     if(pi==null){star.position.y=-99;u.out('<p>Choose a problem. The towers show illustrative scores for three models. No model is highest everywhere, which is the "No Free Lunch" idea.</p>');return;}
     const pk=PICK[pi];star.position.set((pi-1.5)*5.4+(pk-1)*1.35,SCR[pi][pk]/100*7+1.6,0);
     const top=SCR[pi].indexOf(Math.max(...SCR[pi]));
     u.out(kv([['Problem',P[pi]],['Highest score',M[top]+' ('+SCR[pi][top]+')'],['Best choice',M[pk],'g']])+'<p>'+WHY[pi]+'</p>');};
   P.forEach((p,i)=>u.btn(p,()=>sel(i)));u.btn('Show all',()=>sel(null),{pri:true});
   S.onPick(tw2,o=>sel(o.userData.pi));
   sel(null);
  }},
 {label:'Small data overfits',view:[26,.7,1.0,[4,2.5,0]],hint:'Slide the number of training points.',tip:'Dots are training data from a curved pattern plus noise. Sky line: too simple (degree 1). Teal line: balanced (degree 3). Coral line: very flexible (degree 8). Towers at right: error on the training data (dim) and on unseen test data (bright).',
  build(g,u){
   const rr=rng(8),f=x=>Math.sin(2.2*x);const ALL=[],TEST=[];for(let i=0;i<80;i++){const x=rr()*2-1;ALL.push([x,f(x)+nrm(rr)*.28]);}const rt=rng(99);for(let i=0;i<80;i++){const x=rt()*2-1;TEST.push([x,f(x)+nrm(rt)*.28]);}
   const X=x=>x*7-3,Y=y=>y*2.2+3.5;S.floor(g,22,22,0);
   S.bar(g,[-10,0,0],[4,0,0],.03,0x6b8299);S.bar(g,[-3,0,0],[-3,7.5,0],.03,0x6b8299);
   S.label(g,'x',[4.6,0,0],{size:.5});S.label(g,'y',[-3,8,0],{size:.5});
   const tl=[];for(let i=0;i<=60;i++){const x=-1+i/30;tl.push([X(x),clamp(Y(f(x)),.1,7.2),0]);}S.line(g,tl,0xffffff,.35);
   const DEG=[1,3,8],CC=[C.sky,C.teal,C.coral],NM=['Too simple (deg 1)','Balanced (deg 3)','Very flexible (deg 8)'];
   const curves=DEG.map((d,i)=>S.line(g,tl,CC[i],1));
   const towers=[];DEG.forEach((d,i)=>{towers.push([tw(S,g,8+i*3,0,.1,CC[i],.9,{emi:.1,op:.55}),tw(S,g,9+i*3,0,.1,CC[i],.9,{emi:.5})]);S.label(g,NM[i].split(' (')[0],[8.5+i*3,-.9,0],{size:.42,color:'#'+CC[i].toString(16).padStart(6,'0')});});
   S.label(g,'dim = training error   bright = test error',[11.5,8,0],{size:.45});
   let dots=[];let n=10;
   const mse=(c,D)=>D.reduce((s,p)=>s+(polyval(c,p[0])-p[1])**2,0)/D.length;
   const upd=()=>{dots.forEach(d=>g.remove(d));dots=[];const D=ALL.slice(0,n);D.forEach(p=>dots.push(S.ball(g,[X(p[0]),clamp(Y(p[1]),.2,7.2),0],.16,C.white,{emi:.4})));
     const res=DEG.map((d,i)=>{const c=polyfit(D.map(p=>p[0]),D.map(p=>p[1]),d);const pts=[];for(let k=0;k<=60;k++){const x=-1+k/30;pts.push([X(x),clamp(Y(polyval(c,x)),.1,7.2),0]);}S.setLine(curves[i],pts);
       const tr=mse(c,D),te=mse(c,TEST);setH(towers[i][0],Math.min(5,tr*4));setH(towers[i][1],Math.min(5,te*4));return{tr,te};});
     const over=res[2].te>res[1].te*1.15;
     u.out(kv([['Training points',n],['Deg 1: train / test',fx(res[0].tr,2)+' / '+fx(res[0].te,2)],['Deg 3: train / test',fx(res[1].tr,2)+' / '+fx(res[1].te,2)],['Deg 8: train / test',fx(res[2].tr,2)+' / '+fx(res[2].te,2),over?'b':'g']])+'<p>'+(over?'<b>Overfitting:</b> the very flexible model bends to chase the noise, so its training error is tiny but its error on unseen data is larger. With so little data a simpler model is the safer choice.':'With this many examples the flexible model has enough data to settle down, so the gap closes. <b>More data lets complex models work without overfitting.</b>')+' The too-simple model has high error on both: it cannot capture the curve.</p>');};
   u.slider('Training points',9,80,1,n,v=>{n=v;upd();});
   upd();
  }},
 {label:'Interpretability vs power',view:[19,.6,1.0,[5,4.5,0]],hint:'Set how much the decision must be explainable.',tip:'Each sphere is a model, placed by how interpretable it is (right = easier to explain) and how much predictive power it often has (higher = more accurate). Positions are illustrative. The violet wall is your interpretability requirement: models behind it are ruled out.',
  build(g,u){
   S.floor(g,24,24,0);S.axes(g,10,['interpretability','predictive power',''],{flat:true,min:0});
   const MD=[['Linear regression',.95,.42,C.teal],['Decision tree',.85,.62,C.amber],['K-NN',.5,.7,C.sky],['Neural network',.2,.88,C.violet],['CNN (images)',.08,.97,C.coral]];
   const ms=MD.map(m=>{const s=S.ball(g,[m[1]*10,m[2]*10,0],.6,m[3],{emi:.4});S.label(g,m[0],[m[1]*10,m[2]*10+1.2,0],{size:.5});return s;});
   S.label(g,'BLACK BOX',[1.5,-.9,0],{size:.5,color:'#ff8093'});S.label(g,'WHITE BOX',[8.5,-.9,0],{size:.5,color:'#52da9f'});
   const wall=S.plane(g,[0,5,0],10,10,C.violet,{op:.2,vertical:true});wall.rotation.y=Math.PI/2;
   const ring=S.ball(g,[0,-99,0],1.0,0xffffff,{op:.25});
   let req=.5;
   const upd=()=>{wall.position.set(req*10,5,0);let b=-1;MD.forEach((m,i)=>{const ok=m[1]>=req-1e-9;ms[i].material=S.mat(m[3],{emi:ok?.5:0,op:ok?1:.25});if(ok&&(b<0||m[2]>MD[b][2]))b=i;});
     ring.position.set(MD[b][1]*10,MD[b][2]*10,0);ring.material=S.mat(C.amber,{op:.35});
     u.out(kv([['Interpretability required',Math.round(req*100)+'%'],['Models still allowed',MD.filter(m=>m[1]>=req-1e-9).length+' of 5'],['Most powerful allowed',MD[b][0],'g']])+'<p>Among the models that satisfy the explainability requirement, choose the one with the most predictive power: <b>'+MD[b][0]+'</b>. '+(req>=.8?'When a decision must be explained (a refused loan, a medical prediction) a white-box model wins, even at some cost in accuracy.':req<=.1?'When only the accuracy of the result matters (an image competition) a black-box model is the right choice.':'A middle requirement allows models that are somewhat explainable and fairly accurate.')+'</p>');};
   const sl=u.slider('Interpretability required',0,1,.05,req,v=>{req=v;upd();},v=>Math.round(v*100)+'%');
   const gs=u.g('Scenarios');
   gs.btn('Bank must explain a refusal',()=>{sl.set(.8);req=.8;upd();});gs.btn('Hospital must justify each prediction',()=>{sl.set(.7);req=.7;upd();});gs.btn('Image-recognition contest',()=>{sl.set(0);req=0;upd();});
   upd();
  }}
 ]);
};

SC.a441=function(S){
 S.modes([
 {label:'Nine issues',view:[19,.8,1.0,[0,0,0]],hint:'Click a block, or use Next issue.',tip:'Each block is one ethical issue. Click it to read what it means, why it matters and a real example. A real system usually touches several at once.',
  build(g,u){
   const IS=[
    ['Accountability','Who is responsible when an ML system causes harm.','Responsibility is shared between developer, company and user, and the law has not settled it, so people harmed may have no one answerable.','A self-driving car causes a fatal crash and there is no agreed answer on who is at fault.',C.coral],
    ['Algorithmic fairness','Outcomes should be equitable across groups.','"Fair" can be defined in competing ways, and a model tuned for overall accuracy may still treat some groups worse.','A reoffending-risk model giving harsher scores to one ethnic group for the same behaviour.',C.amber],
    ['Bias','Systematically unfair results, usually learned from the data.','Training data reflects an unequal world, so the model learns and can amplify the unfairness. Nobody needs to intend it.','A recruiting tool marks down CVs mentioning "women\'s" because past hires were mostly men.',C.violet],
    ['Consent','Whether people genuinely agreed to their data being used.','Clicking "accept" on a long agreement is not understanding, so informed consent is often missing.','An old photo used to train a face-recognition system its subject has never heard of.',C.sky],
    ['Environmental impact','The energy and carbon cost of training and running models.','Data centres use a great deal of electricity and the cost grows as models get larger.','Training one large model can release significant carbon dioxide.',C.lime],
    ['Privacy','Protecting personal data that models collect and use.','Pattern-finding can reveal things people never meant to share.','Inferring a health condition or beliefs from purchases or liked posts.',C.teal],
    ['Security','Models can be attacked or tricked.','Adversarial inputs change things too little for a person to notice but enough to fool a model, with dangerous results.','Stickers on a stop sign make a self-driving car read a speed-limit sign.',C.coral],
    ['Societal impact','Broad effects of widespread ML on society.','Jobs lost to automation, widening inequality and changes to how people find information can affect whole groups at once.','Automated systems replacing customer-service or transport roles.',C.amber],
    ['Transparency','Whether a decision can be explained.','The most accurate models are often black boxes, so affected people cannot see why a decision was made or challenge it.','A person refused a loan by a deep-learning model cannot learn why, so cannot appeal.',C.violet]];
   S.floor(g,24,24,0);const R=7;const cs=[];
   IS.forEach((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/9,p=[Math.cos(a)*R,.8,Math.sin(a)*R];const c=S.cube(g,p,[2.5,1.6,2.5],s[4],{emi:.25});c.userData={i,c:s[4]};cs.push(c);S.label(g,s[0],[p[0],2.5,p[2]],{size:.55});});
   S.ball(g,[0,1,0],1.3,0x35506b,{emi:.2});S.label(g,'An ML system',[0,2.9,0],{size:.6});
   let cur=-1;
   const show=i=>{cur=i;cs.forEach((c,j)=>{c.material=S.mat(c.userData.c,{emi:j===i?.95:.25});c.scale.y=j===i?2.2:1.6;c.position.y=j===i?1.1:.8;});const s=IS[i];
     u.out('<p><b>'+s[0]+':</b> '+s[1]+'</p><p><b>Why it matters:</b> '+s[2]+'</p><p><b>Example:</b> '+s[3]+'</p>');};
   S.onPick(cs,o=>show(o.userData.i));
   u.btn('Next issue',()=>show((cur+1)%9),{pri:true});
   const gt=u.g('Tensions to weigh');gt.btn('Privacy vs accuracy',()=>{u.out('<p>More personal data can mean better predictions, but at a cost to <b>privacy</b> and <b>consent</b>. A good discussion weighs both.</p>');});gt.btn('Accuracy vs transparency',()=>{u.out('<p>The most accurate models are often black boxes. Gaining predictive power can mean losing <b>transparency</b>, which also weakens <b>accountability</b>.</p>');});
   u.out('<p>Click a block to read about that issue.</p>');
  }},
 {label:'Bias feedback loop',view:[22,.75,1.0,[0,3,0]],hint:'Run cycles and watch the bias grow.',tip:'Two districts have exactly the same real crime (ghost outlines). A model trained on last cycle\'s recorded arrests sends patrols where more arrests were recorded. More patrols there produce more recorded arrests next cycle.',
  build(g,u){
   S.floor(g,26,26,0);
   const nodes=[['Biased data',[-7,6,-7],C.coral],['Model learns the bias',[0,9.5,-7],C.violet],['Patrols sent there',[7,6,-7],C.amber]];
   nodes.forEach(n=>{S.ball(g,n[1],.9,n[2],{emi:.5});S.label(g,n[0],[n[1][0],n[1][1]+1.6,n[1][2]],{size:.55});});
   S.arrow(g,[-6,6.5,-7],[-1,9,-7],0x6b8299,.07);S.arrow(g,[1,9,-7],[6,6.5,-7],0x6b8299,.07);S.arrow(g,[6,5.5,-7],[-6,5.5,-7],C.coral,.08);S.label(g,'more arrests recorded: confirms the model',[0,4.4,-7],{size:.5,color:'#ff8093'});
   const A=tw(S,g,-4,0,.1,C.coral,3.2),B=tw(S,g,4,0,.1,C.sky,3.2);
   const gA=S.cube(g,[-4,2,0],[3.6,4,3.6],0xffffff,{op:.1}),gB=S.cube(g,[4,2,0],[3.6,4,3.6],0xffffff,{op:.1});
   S.label(g,'District A',[-4,-.9,2.4],{size:.55});S.label(g,'District B',[4,-.9,2.4],{size:.55});S.label(g,'Real crime is equal (outline)',[0,4.8,1.5],{size:.45,color:'#e8f1f8'});
   const al=S.label(g,'',[-4,0,0],{size:.5,color:'#ffffff'}),bl=S.label(g,'',[4,0,0],{size:.5,color:'#ffffff'});
   let p0=.55,ps=.55,cyc=0,hist=[.55];const GAM=1.6;
   const draw=()=>{setH(A,ps*8);setH(B,(1-ps)*8);al.position.set(-4,ps*8+.9,0);bl.position.set(4,(1-ps)*8+.9,0);al.userData.setText(Math.round(ps*100)+'% of patrols');bl.userData.setText(Math.round((1-ps)*100)+'% of patrols');
     u.out(kv([['Cycle',cyc],['Patrols to A',Math.round(ps*100)+'%',ps>.7?'b':'a'],['Patrols to B',Math.round((1-ps)*100)+'%'],['True crime','50% / 50%','g']])+'<p>History of A\'s share: '+hist.map(v=>Math.round(v*100)+'%').join(' → ')+'</p><p>The starting gap was small, but each cycle the model trusts its own recorded data more. <b>The bias is not just repeated but amplified.</b> "Garbage in, garbage out": the fault is in the data, not an algorithm written to be unfair.</p>');};
   const cycle=()=>{ps=Math.pow(ps,GAM)/(Math.pow(ps,GAM)+Math.pow(1-ps,GAM));cyc++;hist.push(ps);if(hist.length>9)hist.shift();draw();};
   const reset=()=>{ps=p0;cyc=0;hist=[p0];draw();};
   u.btn('Run one cycle',cycle,{pri:true});u.btn('Run 5 cycles',()=>{for(let i=0;i<5;i++)cycle();});u.btn('Reset',reset);
   u.slider('Starting patrol share to A',50,70,1,55,v=>{p0=v/100;reset();},v=>v+'%');
   draw();
  }},
 {label:'Engagement feed',view:[19,.8,1.0,[0,1,0]],hint:'Click the top post a few times.',tip:'Each block is a post. Colour is its viewpoint (four viewpoints); height is how sensational it is. The eight raised posts with a glowing base are the ones the algorithm shows. Score = sensationalism plus similarity to what the user clicked before.',
  build(g,u){
   S.floor(g,24,24,0);const VC=[C.teal,C.amber,C.coral,C.violet],VN=['Viewpoint A','Viewpoint B','Viewpoint C','Viewpoint D'];
   const rr=rng(21);const P=[];for(let i=0;i<24;i++)P.push({v:i%4,s:.15+rr()*.85});
   VN.forEach((n,i)=>S.label(g,n,[-10.6,0,-3+i*2],{size:.45,color:'#'+VC[i].toString(16).padStart(6,'0')}));
   P.forEach((p,i)=>{p.x=((i%6)-2.5)*2.3;p.z=(Math.floor(i/6)-1.5)*2.3;p.pad=S.cube(g,[p.x,.05,p.z],[2,.1,2],0x24384c);p.m=S.cube(g,[p.x,.5,p.z],[1.5,1,1.5],VC[p.v],{emi:.2});p.m.userData={i};});
   let hist=[0,0,0,0],bal=false,shown=[];
   const aff=v=>{const t=hist.reduce((a,b)=>a+b,0);return t?hist[v]/t:.25;};
   const rank=()=>{const sc=P.map((p,i)=>({i,sc:.6*p.s+.4*aff(p.v)}));sc.sort((a,b)=>b.sc-a.sc);
     if(!bal)return sc.slice(0,8).map(x=>x.i);const out=[];for(let v=0;v<4;v++)out.push(...sc.filter(x=>P[x.i].v===v).slice(0,2).map(x=>x.i));return out.sort((a,b)=>sc.findIndex(x=>x.i===a)-sc.findIndex(x=>x.i===b));};
   const upd=()=>{shown=rank();P.forEach((p,i)=>{const on=shown.includes(i);const hh=.5+p.s*2.4;p.m.scale.y=hh;p.m.position.y=.2+hh/2;p.m.material=S.mat(VC[p.v],{emi:on?.6:0,op:on?1:.28});p.pad.material=S.mat(on?C.lime:0x24384c,{emi:on?.8:0});});
     const mix=[0,0,0,0];shown.forEach(i=>mix[P[i].v]++);const avg=shown.reduce((s,i)=>s+P[i].s,0)/shown.length;const distinct=mix.filter(x=>x>0).length;
     u.out(kv([['Viewpoints in feed',distinct+' of 4',distinct<=1?'b':distinct<4?'a':'g'],['Mix (A/B/C/D)',mix.join(' / ')],['Average sensationalism',fx(avg*100,0)+'%',avg>.7?'b':'a'],['Clicks so far',hist.reduce((a,b)=>a+b,0)]])+'<p>'+(bal?'<b>Balanced feed:</b> two posts per viewpoint are guaranteed, so the user keeps seeing other views even after many clicks. Sensational posts are still ranked first within each viewpoint.':'<b>Engagement only:</b> sensational posts rank highest, and after clicks the algorithm favours the same viewpoint. Click several times and the feed collapses to one viewpoint: a <b>filter bubble</b>, which can deepen polarisation and speed the spread of misinformation.')+'</p>');};
   u.btn('Click the top post',()=>{hist[P[shown[0]].v]++;upd();},{pri:true});
   u.toggle('Balanced feed (guarantee variety)',false,v=>{bal=v;upd();});u.btn('Reset user history',()=>{hist=[0,0,0,0];upd();});
   S.onPick(P.map(p=>p.m),o=>{hist[P[o.userData.i].v]++;upd();});
   upd();
  }}
 ]);
};

SC.a442=function(S){
 const TECH=['Pervasive AI','Augmented reality','Virtual reality','Quantum computing'],AREA=['Society','Individual rights','Privacy','Equity'];
 const TXT=[
  ['Job displacement','Mass surveillance','Always-on monitoring','Unequal access to beneficial AI'],
  ['Digital divide','Recording others without consent','Who owns the data','Advantage to those who can afford it'],
  ['Social isolation','Immersive persuasion','Gaze and emotion data','Cost of access'],
  ['Little direct concern here','Little direct concern here','Breaks the encryption that protects data','Power concentrated in a few governments and firms']];
 const LV=[[3,3,3,2],[1.6,3,2.4,2],[2.6,2,3,2],[0,0,3,3]];
 const BEN=['More efficient city systems and personalised services','Useful information overlaid on the world (surgery, navigation, education)','Safe training, therapy for phobias and connection across distance','Simulating molecules for new medicines; training stronger AI'];
 S.modes([
 {label:'Four technologies',view:[20,.85,1.0,[0,1.5,0]],hint:'Click a tower to read the concern.',tip:'Rows are technologies, columns are the four impact areas. Tower height shows how strong the concern is; the grey stub means little direct concern. This is a starting point for discussion, not a verdict.',
  build(g,u){
   S.floor(g,22,22,0);const cs=[];const AC=[C.sky,C.amber,C.violet,C.teal];
   TECH.forEach((t,ti)=>{S.label(g,t,[-9.6,.2,(ti-1.5)*3.6],{size:.5});AREA.forEach((a,ai)=>{const lv=LV[ti][ai];const h=lv?lv*1.3:.2;const m=tw(S,g,(ai-1.5)*3.6,(ti-1.5)*3.6,h,lv?AC[ai]:0x4a6a8a,2.4);m.userData={ti,ai};cs.push(m);});});
   AREA.forEach((a,ai)=>S.label(g,a,[(ai-1.5)*3.6,.2,7.4],{size:.5,color:'#'+AC[ai].toString(16).padStart(6,'0')}));
   const show=(ti,ai)=>{cs.forEach(m=>{const on=m.userData.ti===ti&&m.userData.ai===ai;m.material=S.mat(LV[m.userData.ti][m.userData.ai]?AC[m.userData.ai]:0x4a6a8a,{emi:on?.9:.15,op:on||ti==null?1:.55});});
     u.out('<p><b>'+TECH[ti]+' and '+AREA[ai].toLowerCase()+':</b> '+TXT[ti][ai]+'.</p><p><b>Key benefit to weigh against it:</b> '+BEN[ti]+'.</p>');};
   S.onPick(cs,o=>show(o.userData.ti,o.userData.ai));
   TECH.forEach((t,i)=>u.btn(t,()=>{const row=cs.filter(m=>m.userData.ti===i);cs.forEach(m=>{const on=m.userData.ti===i;m.material=S.mat(LV[m.userData.ti][m.userData.ai]?AC[m.userData.ai]:0x4a6a8a,{emi:on?.6:0,op:on?1:.3});});
     u.out('<p><b>'+t+'.</b> Benefit: '+BEN[i]+'.</p><p>Concerns: '+AREA.map((a,k)=>'<b>'+a+'</b> ('+TXT[i][k].toLowerCase()+')').join('; ')+'.</p>');}));
   u.out('<p>Click a tower, or choose a technology.</p>');
  }},
 {label:'Weigh it up',view:[20,.45,1.1,[0,3,0]],hint:'Click a block to change its weight.',tip:'Benefits sit on the left pan and risks on the right. Click any block to cycle its weight from 1 to 3 and watch the balance. The tilt is your judgement, not a fixed fact.',
  build(g,u){
   const ITEMS=[
    [['Efficient cities','Personalised services','Smarter homes'],['Job displacement','Mass surveillance','Unequal access']],
    [['Info where needed','Better navigation','Education'],['Recording consent','Data ownership','Digital divide']],
    [['Safe training','Therapy','Presence'],['Social isolation','Gaze/emotion data','Cost of access']],
    [['New medicines','Stronger AI','Simulation'],['Breaks encryption','Power concentrated','Unequal capability']]];
   S.floor(g,22,22,0);S.cube(g,[0,2,0],[.6,4,.6],0x4a6a8a);S.cube(g,[0,.15,0],[4,.3,2.4],0x4a6a8a);

 {label:'Guidelines fall behind',view:[22,.7,1.0,[0,3,0]],hint:'Change how often guidelines are reviewed.',tip:'Sky towers: what the technology can do over time. Amber towers: what the guidelines cover. Coral on top: the gap, where situations arise that no rule anticipated. Each step is a few years.',

     const pct=fin/cap(NS-1)*100;
     u.out(kv([['Review interval',never?'never':'every '+iv+' steps'],['Gap at the end',fx(fin,1),pct>50?'b':pct>20?'a':'g'],['Share of capability uncovered',Math.round(pct)+'%',pct>50?'b':'g'],['Average gap',fx(tot/NS,2)]])+'<p>Technology keeps growing but guidelines only change when they are reviewed. '+(never?'With <b>no review</b> the rules from the start stay fixed while capability races ahead, so most of what the technology can do is covered by no rule.':iv<=3?'Frequent review keeps the gap small, so society can shape the technology instead of only reacting to harm.':'The gap opens between reviews and is largest just before each one. Being <b>proactive</b> (reviewing sooner) keeps the rules in step.')+' The aim is not to halt progress but to keep rules in step with what the technology can now do.</p>');};

T.push({
  id:'a411',code:'A4.1.1',group:'Foundations',short:'Types of machine learning',title:'Types of machine learning and their real-world uses',
  blurb:'Three paradigms, one technique, one strategy.',
  verb:'Describe',cmd:'Give a detailed account. For each approach say what it is, what data it uses, what task it does, and name a real application with a reason it fits.',
  ls:'Describe the types of machine learning and their applications in the real world.',
  lead:'Machine learning (ML) is a branch of AI where a system <b>learns from data</b> instead of following rules a programmer wrote by hand. There are <b>three paradigms</b> (supervised, unsupervised, reinforcement), plus <b>deep learning</b> (a technique) and <b>transfer learning</b> (a strategy).',
  hook:'Two folders of dog photos. In one, every photo is tagged with its breed. In the other, there are no tags at all. What could a system learn from the first folder that it cannot learn from the second, and what might it still find useful in the second?',
  stageTitle:'3D lab: five approaches to learning',stageSub:'Labelled data, hidden groups, rewards, deep layers, reused knowledge',
  lab:{how:['On <b>Labelled vs unlabelled</b>, press <b>Predict new point</b> on the left several times. Then press <b>Find the groups</b> on the right.','On the right side, press <b>Add new point</b> first. Then press <b>Train a supervised model on the clusters</b> and add another.','On <b>Reinforcement</b>, press <b>Train</b> and watch the arrows turn toward the goal.','On <b>Technique and strategy</b>, switch paradigms, then drag the labelled-examples slider with transfer learning on and off.'],
    see:['Supervised learning gives every new point a class straight away because training data carried labels.','Unsupervised learning finds groups but cannot name them or place a new point until a supervised step is added.','In reinforcement learning there is no dataset. The agent creates its own experience and the reward arrives after the action.','Transfer learning reaches good accuracy with far fewer labelled examples because early layers are reused.']},
  sections:[
    {tag:'Idea',h:'Traditional programming vs machine learning',p:'<b>Traditional programming:</b> input data + explicit rules = output. <b>Machine learning:</b> input data + desired outputs (or interaction) = a learned model.',ul:['Rule-based spam filter: <code>IF email contains "free prize" THEN spam</code>. It breaks whenever spam changes its wording.','ML spam filter: show it 50,000 labelled emails; it learns which features separate spam from real mail and applies that to messages it has never seen.']},
    {tag:'Structure',h:'Three paradigms, one technique, one strategy',p:'Supervised, unsupervised and reinforcement learning describe <b>how the learning is structured</b>. Deep learning is a <b>technique</b> usable inside any paradigm. Transfer learning is a <b>strategy</b> for reusing a trained model. A question asking for "types of machine learning" wants the three paradigms.'},
    {tag:'1',h:'Supervised learning: labelled data predicts outcomes',p:'Trains on a dataset where every example already has a correct answer, the <b>label</b>. The model learns the link between input and label, then predicts labels for new data.',ul:['<b>Classification:</b> predicts a category from a fixed set (spam or not spam; digits 0 to 9).','<b>Regression:</b> predicts a numerical value on a continuous scale (blood pressure; property price).','<b>Limitation:</b> producing labelled data needs human effort, which is expensive and slow for large or specialist datasets.','<b>Analogy:</b> a student learns bird species from a field guide where every photo is labelled. Photos are inputs, names are labels.','<b>Applications:</b> sentiment analysis (reviews labelled positive, neutral, negative), medical imaging diagnostics (scans already diagnosed by radiologists), spam detection (subject patterns, sender behaviour, link density).']},
    {tag:'2',h:'Unsupervised learning: hidden patterns in unlabelled data',p:'No labels and no correct answers. The algorithm must discover structure on its own. Two common tasks:',ul:['<b>Clustering:</b> groups similar items together without being told what the groups should be (customers grouped by behaviour).','<b>Association:</b> finds items that frequently occur together in a record (bread and butter in the same basket: market basket analysis).','<b>Limitation:</b> the model cannot name the groups it finds. Interpreting a cluster needs human judgement.','<b>Analogy:</b> a librarian sorts 10,000 books with no genre labels. The categories are meaningful but the librarian, not the data, named them.','<b>Applications:</b> market basket analysis (store layout, promotions, recommendations), customer segmentation (different marketing per group), anomaly detection (a bank flags unusual transactions without labelled fraud examples).']},
    {tag:'3',h:'Reinforcement learning: trial, error and reward',p:'No dataset. An <b>agent</b> interacts with an <b>environment</b>, takes actions and gets <b>rewards</b> or penalties. Over many interactions it learns a <b>policy</b>: a mapping from states to actions that maximises total reward over time.',ul:['<b>Agent:</b> the learner or decision-maker; observes the state and selects an action.','<b>Environment:</b> the world it acts in; responds with a new state and a reward.','<b>Reward:</b> numerical signal for how good or bad an outcome was.','<b>Policy:</b> the learned strategy.','<b>Core loop:</b> observe state, choose action, receive reward and new state, update policy, repeat.','<b>Analogy:</b> training a dog to sit. A treat follows the correct behaviour. No labelled dataset is involved.','<b>Applications:</b> robot navigation (reward for reaching a destination, penalty for collisions), game playing (millions of self-play games), data-centre cooling (balance cooling efficiency and hardware safety).']},
    {tag:'Technique',h:'Deep learning: multi-layer neural networks',p:'Not a separate category of learning. It uses <b>artificial neural networks with many layers</b>; each layer learns a more abstract representation. It shines on <b>unstructured data</b> (images, audio, text, video) because it learns its own features from raw input.',ul:['<b>Limitation:</b> needs large amounts of data and heavy computing power; the learned representations are hard to interpret (a "black box").','<b>Analogy:</b> recognising a cat builds up from edges, to shapes, to ears and whiskers, to "cat".','<b>Applications:</b> self-driving vehicles detecting pedestrians and signs, large language models and translation, detecting lesions or fractures in medical images.']},
    {tag:'Strategy',h:'Transfer learning: reuse a pre-trained model',p:'A model trained on a large dataset for one task is the starting point for a second, related task and is <b>fine-tuned</b> (its weights are trained a little more) on a small amount of new data.',ul:['<b>Benefit:</b> far less labelled data and training time than building from scratch.','<b>Fine-tuning:</b> continue training the pre-trained parameters on the new data; the model keeps its general knowledge and adapts to the new task.','<b>Analogy:</b> a civil engineer who knows structural loading learns to design a new bridge type faster than a beginner.','<b>Applications:</b> medical imaging with only a few hundred scans (start from a model trained on millions of photographs), low-resource language translation, detecting specialist industrial components.']}
  ],
  tables:[{h:'Summary comparison',head:['Approach','Data / input','Task types','Example applications'],rows:[
    ['Supervised learning','Labelled data','Classification, regression','Sentiment analysis, medical diagnosis'],
    ['Unsupervised learning','Unlabelled data','Clustering, association','Customer segmentation, market basket analysis'],
    ['Reinforcement learning','No dataset; learns from interaction','Policy optimisation','Robotic navigation, game playing'],
    ['Deep learning (technique)','Any (supervised, unsupervised or RL)','Complex pattern recognition in unstructured data','Object detection, face recognition'],
    ['Transfer learning (strategy)','Small labelled dataset for the target task','Fine-tuning an existing model','Rare disease detection, low-resource translation']]}],
  traps:['Listing deep learning and transfer learning as the fourth and fifth <b>types</b> of ML. There are three paradigms. Deep learning is a technique; transfer learning is a strategy.','Choosing supervised learning for any task that involves prediction. The test is whether <b>labelled training data exists</b>. No labels, no supervised learning.','Thinking unsupervised learning predicts the group of a new point. It discovers groups in existing data. Classifying new data needs a supervised model trained on the discovered groups.','Confusing reinforcement with supervised learning because both have a "correct" outcome. In RL there is no labelled dataset; the agent generates its own experience and the reward comes <b>after</b> the action.','Describing deep learning as a learning type parallel to supervised and unsupervised. Say: "a technique using multi-layered neural networks, applicable to supervised, unsupervised or reinforcement tasks".','Describing transfer learning as "more data" or "a model that improves with use". It means a separately trained model is the starting point for a new task.'],
  gloss:[['Label','The known correct answer attached to a training example.'],['Classification','Predicting a category from a fixed set of classes.'],['Regression','Predicting a continuous numerical value.'],['Clustering','Grouping similar items without predefined groups.'],['Association','Finding items that frequently occur together.'],['Agent','The learner that observes a state and picks an action.'],['Environment','The world that returns a new state and a reward.'],['Reward','Numerical feedback on how good an outcome was.'],['Policy','The learned strategy mapping states to actions.'],['Deep learning','Technique using many-layer neural networks.'],['Unstructured data','Images, audio, text and video with no fixed table format.'],['Transfer learning','Reusing a pre-trained model as the start for a related task.'],['Fine-tuning','Continuing to train a pre-trained model on new data.']],
  quiz:[
    {t:'one',q:'A data scientist has a large customer dataset and must find natural groupings without any pre-existing labels. Which ML approach is most suitable?',o:['Reinforcement learning','Transfer learning','Supervised learning','Unsupervised learning'],a:3,why:'No labels and the goal is to discover groups: that is unsupervised clustering.'},
    {t:'one',q:'What is the primary characteristic of the data used to train a supervised learning model?',o:['It is very large','It has no labels','It is labelled with the correct outputs','It is unstructured'],a:2,why:'Supervised learning needs labelled examples. Size and structure are not what define it.'},
    {t:'one',q:'An AI learns a video game by receiving a score at the end of each game, which it tries to maximise over time. This is:',o:['Unsupervised learning','Supervised learning','Transfer learning','Reinforcement learning'],a:3,why:'An agent interacting with an environment and maximising a reward signal is reinforcement learning.'},
    {t:'one',q:'Deep learning is best described as:',o:['A technique using multi-layered neural networks, applicable to supervised, unsupervised and reinforcement learning','A learning paradigm completely separate from supervised or unsupervised learning','A type of learning that only works with text data','A method for making models smaller and faster'],a:0,why:'Deep learning is a technique, not a fourth paradigm.'},
    {t:'one',q:'A developer downloads a powerful pre-existing image recognition model and fine-tunes it on a flower dataset. This strategy is:',o:['Reinforcement learning','Unsupervised learning','Transfer learning','Supervised learning'],a:2,why:'Reusing a pre-trained model as a starting point and fine-tuning it is transfer learning.'},
    {t:'one',q:'Classifying emails as "Spam" or "Not Spam" is a classic example of:',o:['Market basket analysis','An unsupervised clustering problem','A supervised classification problem','A reinforcement learning problem'],a:2,why:'Labelled emails and a fixed set of classes: supervised classification.'},
    {t:'one',q:'In reinforcement learning, what is the term for the learner or decision-maker that interacts with the world?',o:['The policy','The agent','The environment','The reward'],a:1,why:'The agent observes the state and selects actions. The policy is its strategy.'},
    {t:'one',q:'Which is the best example of unsupervised learning?',o:['Identifying a person in a photograph','Finding that customers who buy bread often also buy milk','Training a robot to navigate a maze','Predicting a house sale price from its features'],a:1,why:'Finding items that occur together without labels is association, an unsupervised task.'},
    {t:'one',q:'The primary advantage of transfer learning is that it:',o:['Reduces the need for massive datasets and long training times','Can work with data that has no labels','Is the only way to work with image data','Always produces a more accurate model than one trained from scratch'],a:0,why:'Reusing learned knowledge means less data and less training time. It does not guarantee higher accuracy.'},
    {t:'one',q:'A model that processes medical scans to assist radiologists is a real-world application of:',o:['Robotics navigation','Sentiment analysis','Medical imaging diagnostics','Market basket analysis'],a:2,why:'This is the standard supervised-learning application in medical imaging diagnostics.'},
    {t:'multi',q:'Select <b>all</b> that are fundamental learning <b>paradigms</b> (not a technique or strategy).',o:['Supervised learning','Unsupervised learning','Reinforcement learning','Deep learning','Transfer learning'],a:[0,1,2],why:'Three paradigms. Deep learning is a technique and transfer learning is a strategy.'},
    {t:'order',q:'Put the reinforcement-learning loop in order.',o:['The agent observes the current state','The agent selects an action','The environment returns a reward and a new state','The agent updates its policy'],why:'Observe, act, receive reward and new state, update policy, then repeat.'}
  ],
  paper:[
    {q:'Describe the difference between supervised and unsupervised learning, referring to the data each uses.',m:4,pts:['Supervised learning uses <b>labelled</b> data (each example has a known correct answer).','It learns the relationship between inputs and labels, then predicts labels for new data (classification or regression).','Unsupervised learning uses <b>unlabelled</b> data with no correct answers.','It discovers structure on its own, such as clusters or items that occur together.','Supervised needs human effort to label; unsupervised cannot name the groups it finds (any one contrast point).']},

    {q:'Describe why transfer learning is useful when only a small amount of labelled data is available for a task.',m:3,pts:['A model pre-trained on a large dataset has already learned general features.','It is fine-tuned on the small new dataset, so the knowledge is reused rather than learned again.','This needs far less labelled data and training time than training from scratch.']}

T.push({
  id:'a412',code:'A4.1.2',group:'Foundations',short:'Machine learning hardware',title:'Hardware requirements for machine learning',
  blurb:'CPU, GPU, TPU, ASIC, FPGA, edge and cloud.',
  verb:'Describe',cmd:'Name the hardware, explain what matters (processing, storage, scalability) and connect it to the scenario.',
  ls:'Describe the hardware requirements for various scenarios where machine learning is deployed.',
  lead:'The right hardware depends on the task. A decision tree on a few thousand rows runs on a laptop. A large language model needs thousands of specialised processors for weeks. Match hardware to a scenario by weighing <b>processing power, storage and scalability</b>, and first decide whether the scenario is <b>training or inference</b>.',
  hook:'A face-recognition model is trained once, then runs on millions of doorbells for years. Which job needs the more powerful hardware, and which one has to cope with a tiny battery?',
  stageTitle:'3D lab: matching hardware to the job',stageSub:'Training vs inference, serial vs parallel cores, and the full hardware spectrum',
  lab:{how:['On <b>Training vs inference</b>, drag the two sliders and watch the towers for processing, storage and scalability change.','On <b>CPU vs GPU</b>, press <b>Run job</b>. The CPU works through tasks one after another. The GPU does thousands at once.','On <b>Hardware spectrum</b>, press each scenario button to see which hardware wins and why. Click a tower to read about that hardware.'],
    see:['Training is heavy on processing, storage and scalability. Inference is lighter but may need low latency or very low power.','A GPU wins on matrix-style work because it has thousands of simple cores, not because each core is faster.','ASIC is fastest for one fixed job but cannot change. FPGA trades some speed for being reprogrammable.']},
  sections:[
    {tag:'Phases',h:'Training and inference: two different hardware problems',p:'Every model goes through two phases with very different needs.',ul:['<b>Training:</b> feed large amounts of data through the model and adjust its parameters to minimise error. Billions of operations per second for hours, days or weeks. <b>Processing:</b> very high, massively parallel. <b>Storage:</b> very high; whole datasets must be reachable quickly and checkpoints saved. <b>Scalability:</b> critical; training time falls when work is spread across many processors.','<b>Inference:</b> use the trained model to predict on new data. One forward pass, no backpropagation. <b>Processing:</b> moderate. <b>Storage:</b> low to moderate; only the trained parameters are kept. <b>Scalability:</b> variable; it may need to serve millions of requests or run on one low-power device. It may also need <b>low latency</b>.']},
    {tag:'Factors',h:'The three factors',ul:['<b>Processing:</b> how many operations per second, and whether they can run in parallel.','<b>Storage:</b> capacity for training data, model parameters and intermediate results, and the speed at which data can be read into the processor.','<b>Scalability:</b> ability to add more hardware to cut training time or serve more requests, from several GPUs in one machine to thousands of machines.']},
    {tag:'CPU',h:'Central Processing Unit',p:'The general-purpose processor in any laptop. Typically 4 to 32 powerful cores that run complex, varied instructions <b>sequentially</b> at high speed.',ul:['<b>Processing:</b> good for complex logic and branching; poor for the repetitive matrix multiplications that dominate ML training.','<b>Storage:</b> system RAM (fast, limited) and disk (slow). Large datasets may not fit in RAM.','<b>Scalability:</b> limited; more CPUs give marginal gains because of communication overhead.','<b>Use:</b> training only for small datasets and simple models; fine for inference where latency is not critical.','<b>Scenario:</b> a student runs logistic regression on 5,000 rows; a small business runs overnight batch inference on a simple model.']},
    {tag:'GPU',h:'Graphics Processing Unit',p:'Built for rendering graphics, a GPU holds <b>thousands of simpler cores</b> working in parallel. An NVIDIA A100 has 6,912 CUDA cores. This matches the matrix multiplications in neural networks.',ul:['<b>Processing:</b> extremely high throughput; hundreds of times faster than a CPU for neural-network training.','<b>Storage:</b> separate video memory (VRAM), typically 16 GB to 80 GB per card. Model parameters plus a batch of data must fit at once. High memory bandwidth feeds the cores.','<b>Scalability:</b> good; several GPUs per machine or across a cluster. GPU clusters are the backbone of cloud ML.','<b>Scenario:</b> a team trains a CNN on 1 million images using four GPUs; a company serves thousands of recommendation requests per second.']},
    {tag:'TPU',h:'Tensor Processing Unit',p:'A custom chip designed by Google to accelerate tensor operations in neural networks. A TPU is a type of <b>ASIC</b>: every transistor exists to speed up ML computation.',ul:['<b>Processing:</b> faster and more power-efficient than a GPU for deep-learning tensor operations; the advantage is largest with TensorFlow.','<b>Storage:</b> high-bandwidth memory built into the chip design.','<b>Scalability:</b> excellent; TPU Pods connect thousands of chips with dedicated high-speed links.','<b>Scenario:</b> Google trains a new large language model; a company uses Google Cloud ML APIs for large-scale language processing.']},
    {tag:'ASIC',h:'Application-Specific Integrated Circuit',p:'A chip made to do one task permanently. Its logic is fixed at manufacture. Examples: TPUs, Bitcoin-mining chips, face-recognition chips in smart doorbells.',ul:['<b>Processing:</b> highest possible for its task, with no wasted general-purpose logic, and useless for anything else.','<b>Storage:</b> fixed at design time. <b>Scalability:</b> limited; usually deployed as single units.','<b>Flexibility:</b> none. If the algorithm changes, a new chip must be designed and made.','<b>Cost:</b> very high upfront (millions), very low per unit at mass-production scale.','<b>Scenario:</b> a maker of 5 million smart doorbells, each doing face recognition locally with no internet.']},
    {tag:'FPGA',h:'Field-Programmable Gate Array',p:'A chip of configurable logic blocks that the user can <b>reconfigure after manufacture</b> by loading a new configuration file.',ul:['<b>Processing:</b> high for the configured function. Lower than an ASIC for the same task, much higher than a GPU where ultra-low latency matters.','<b>Storage:</b> configurable on-chip memory of moderate size. <b>Scalability:</b> moderate; networked FPGA systems are complex.','<b>Flexibility:</b> very high; this is the defining feature.','<b>Cost:</b> moderate development cost, no new fabrication when the design changes, but dearer per unit than an ASIC at scale.','<b>Scenario:</b> a trading firm prototypes a microsecond-latency ML pipeline whose algorithm is still changing.']},
    {tag:'Edge',h:'Edge devices',p:'Small, low-power units that run <b>inference</b> where the data is produced, without sending it to a server. They may use a dedicated inference chip (an ASIC), a mobile GPU or a small FPGA.',ul:['<b>Processing:</b> low to moderate, tuned for efficiency; enough for a pre-trained model, not for training.','<b>Storage:</b> severely limited; only model parameters and a small data buffer. <b>Scalability:</b> none alone, but many edge devices together process large volumes.','<b>Advantages:</b> works without a network; low latency; privacy because sensitive data never leaves the device.','<b>Scenario:</b> smart doorbell recognising faces; a tablet in a remote clinic running a diagnostic model; an autonomous vehicle processing sensor data in real time.']},
    {tag:'Cloud',h:'Cloud platforms and HPC centres',p:'Cloud platforms (AWS, Google Cloud, Azure) rent large clusters of GPUs and TPUs over the internet. HPC centres are large facilities with supercomputers, often at universities or research institutes.',ul:['<b>Processing:</b> effectively unlimited; limited by budget, not by owned hardware.','<b>Storage:</b> petabyte-scale distributed storage, separate from compute.','<b>Scalability:</b> excellent; scale up for a big run and back down afterwards, so you do not own idle hardware.','<b>Cost:</b> pay-as-you-go with no capital expense on the cloud. HPC centres usually want a research justification and a queue wait instead of payment.','<b>Scenario:</b> a start-up trains a language model on 128 rented GPUs for 48 hours; a university climate group needs more compute than its local servers give.']}
  ],
  keys:[{t:'Exam technique',html:'<b>Step 1:</b> is it training or inference? <b>Step 2:</b> find the constraints: "without internet" points to edge; "millions of units" to ASIC; "limited budget" to cloud; "prototype" or "changing design" to FPGA; "massive scale" or "large model" to a GPU cluster or TPU. <b>Step 3:</b> name the hardware, link it to processing, then comment on storage and scalability, and tie it to the scenario.'}],
  tables:[{h:'Hardware comparison',head:['Hardware','Processing','Storage','Scalability'],rows:[

    ['GPU','Very high: thousands of parallel cores','VRAM is a key limit; high bandwidth','Good: multiple GPUs can be clustered'],

    ['ASIC','Highest for its one task','Fixed at design time','Limited: single units, fixed throughput'],
    ['FPGA','High, below an ASIC for the same task','Configurable on-chip, moderate','Moderate: can be networked but complex'],
    ['Edge device','Low to moderate, efficiency first','Minimal, limited by size and power','None alone; many devices together'],
    ['Cloud / HPC','Effectively unlimited','Petabyte-scale object storage','Excellent: scale up or down on demand']]},
   {h:'Selecting hardware for a scenario',head:['Scenario','Hardware','Justification'],rows:[
    ['Student runs a decision tree on 1,000 rows','Standard laptop (CPU)','Small data, simple model, no parallel work needed.'],
    ['Team trains a CNN on 10 million labelled images','Cloud or HPC GPU cluster','Massive parallel training; a single GPU is not enough.'],
    ['Google trains a new version of its language model','TPU cluster','Purpose-built tensor hardware with huge memory bandwidth.'],
    ['Manufacturer ships face recognition on 1 million doorbells','Edge device (custom ASIC)','Inference must run locally with no network; ASIC gives efficiency and low power at scale.'],
    ['Start-up prototypes a low-latency trading model','FPGA','Design is not final so it must be reprogrammable; microsecond latency.'],
    ['Hospital runs a skin-cancer classifier on a tablet','Edge device (mobile ASIC or GPU)','Runs locally for patient privacy and poor connectivity; low power, fast response.'],
    ['Small firm trains a sentiment model but cannot afford GPU servers','Cloud platform (rented GPUs)','No upfront cost; pay only for training hours, then run inference on cheaper hardware.']]}],
  traps:['Treating a TPU as a kind of GPU, or calling every accelerator a GPU. A GPU is a general-purpose parallel processor that suits ML. A TPU is an ASIC built for one job (tensor operations) and cannot be reprogrammed.','Saying "GPUs are fast" and stopping. Say <b>why</b> (thousands of parallel cores matched to matrix multiplication) and <b>for what</b> (training and high-throughput inference).','Not reading whether the scenario is training or inference. That decision drives every other choice.','Putting training on an edge device. Edge hardware is for inference under power and size limits.'],
  gloss:[['Training','Teaching a model by adjusting its parameters on large data; computationally heavy.'],['Inference','Using a trained model to predict on new data.'],['Latency','Delay between input and result.'],['CPU','General-purpose processor with a few powerful sequential cores.'],['GPU','Processor with thousands of simple parallel cores.'],['VRAM','Memory on the GPU itself.'],['TPU','Google ASIC built for tensor operations.'],['ASIC','Chip with fixed logic made for one task.'],['FPGA','Chip whose logic can be reconfigured after manufacture.'],['Edge device','Small low-power unit running inference locally.'],['Cloud platform','Rented compute and storage over the internet.'],['HPC centre','Facility housing supercomputers for large workloads.']],
  quiz:[

    {t:'one',q:'Using a fully trained model to make a prediction on new data is called:',o:['Clustering','Inference','Training','Compiling'],a:1,why:'Training builds the model. Inference uses it.'},
    {t:'one',q:'A company makes a million smart doorbells that must recognise faces instantly on the device. Which hardware suits best?',o:['An edge device (such as a specialised ASIC)','A standard CPU','An HPC centre','A cloud platform with GPUs'],a:0,why:'Local inference with no network, low power and a huge production run: a custom ASIC edge device.'},
    {t:'one',q:'A university team must train a massive new language model from scratch. Most likely hardware?',o:['An FPGA','A cluster of hundreds of GPUs on a cloud platform','An edge device','A single high-end laptop'],a:1,why:'Very large training needs massive parallel compute that scales.'},
    {t:'one',q:'A chip designed for one single, permanent task to reach the highest performance is:',o:['A GPU','An ASIC','An FPGA','A CPU'],a:1,why:'ASIC logic is fixed at manufacture.'},
    {t:'one',q:'What distinguishes an FPGA from an ASIC?',o:['It is only used for training','It can be reconfigured after manufacturing','It is faster than an ASIC','It uses less power than an ASIC'],a:1,why:'Reprogrammability is the defining feature of an FPGA.'},
    {t:'one',q:'Google\'s TPU is a specialised type of which hardware category?',o:['GPU','ASIC','CPU','FPGA'],a:1,why:'A TPU is an ASIC built for tensor operations.'},
    {t:'one',q:'Which factor is LEAST important for an edge device doing inference?',o:['Small physical size','Low power consumption','Ability to train new models from scratch','Fast response time'],a:2,why:'Edge devices run pre-trained models. Training happens elsewhere.'},
    {t:'one',q:'Why might a start-up with a limited budget rent a cloud platform rather than build its own HPC centre?',o:['Cloud is always faster','HPC cannot be used for ML','It avoids a massive upfront cost and gives scalability','Only the cloud has GPUs'],a:2,why:'Pay-as-you-go removes capital expense and scales on demand.'},
    {t:'one',q:'Training a model is typically associated with which environment?',o:['Edge devices','Standard laptops','FPGAs','Cloud platforms or HPC centres'],a:3,why:'Training is heavy on processing, storage and scalability.'},

    {t:'tf',q:'A TPU can be reprogrammed to do any task, like an FPGA.',a:false,why:'A TPU is an ASIC with fixed logic. An FPGA is the reconfigurable one.'}

  paper:[
    {q:'Describe the difference in hardware requirements between training a machine learning model and using it for inference.',m:4,pts:['Training needs very high processing power, doing billions of operations, usually massively parallel.','Training needs very high storage so whole datasets and checkpoints can be read quickly.','Inference needs only moderate processing: a single forward pass with no backpropagation.','Inference needs little storage (only the trained parameters) but may need low latency or very low power.']},
    {q:'A manufacturer plans one million smart doorbells that recognise faces on the device itself with no internet connection. Describe the most suitable hardware and justify your choice.',m:4,pts:['An <b>edge device using a custom ASIC</b>.','Inference runs locally so no network is needed.','The ASIC gives the highest efficiency and low power for one fixed task.','The high upfront design cost is recovered across a million units.']},

T.push({
  id:'a4310',code:'A4.3.10',group:'Techniques and models',short:'Model selection',title:'Model selection and comparison',
  blurb:'No single best model; interpretability vs power.',
  verb:'Explain',cmd:'Give reasons, not a list. Say why model selection matters, why a model suits a problem, and why one factor might outweigh another. Good answers turn on the word "because".',
  ls:'Explain the importance of model selection and comparison in machine learning.',
  lead:'Knowing how each model works is half the job. The other half is <b>choosing which one to use</b>, because the same problem handed to two algorithms can give very different results. There is <b>no single model best for everything</b> (the "No Free Lunch" idea), so models must be compared against the demands of the problem.',
  hook:'A deep network wins an image competition. Would it also be the best choice for predicting house prices from five features, or for explaining a refused loan to a customer?',
  stageTitle:'3D lab: choosing the right model',stageSub:'See why no model wins everywhere, and trade accuracy for explainability',
  lab:{how:['On <b>No single best model</b>, press each problem and compare the towers for linear regression, decision tree and neural network.','On <b>Small data overfits</b>, slide the dataset size and compare training with test scores.','On <b>Interpretability vs power</b>, press a scenario to see which model fits and why.'],
    see:['The best model changes with the problem and the data.','A complex model on a small dataset can do worse than a simple one because it overfits.','As models get more complex they usually gain predictive power and lose interpretability.']},
  sections:[
    {tag:'Why',h:'Why no single model is best',p:'A deep neural network that wins an image competition may be a poor choice for predicting house prices from a handful of features, and a simple linear regression that models prices well would be useless for recognising faces. Performance depends on the <b>shape of the problem and the nature of the data</b>, not on the model alone. <b>Model selection</b> is comparing candidate models and choosing the best for a specific task. If one algorithm were always best there would be nothing to compare.'},
    {tag:'Problem',h:'The nature of the problem',ul:['Predict a continuous number (house price): <b>regression</b>, such as linear regression.','Sort items into categories (spam or not): <b>classification</b>, such as K-NN, decision trees or neural networks.','Find natural groups in unlabelled data: <b>clustering</b>, such as k-means.','Recognise objects in images: a <b>convolutional neural network</b>.','Choosing a model that does not match the type of problem is the first thing to rule out.']},
    {tag:'Data',h:'The characteristics of the data',ul:['<b>Size:</b> a complex model such as a deep network tends to overfit a small dataset, so a simpler model (decision tree, linear regression) is often safer. Very large datasets give complex models enough examples to learn without overfitting.','<b>Shape of the relationship:</b> if inputs and outcome are roughly linear, linear regression captures it well. A complex non-linear relationship needs a more flexible model such as a decision tree or neural network.']},
    {tag:'Trade-off',h:'Interpretability against predictive power',p:'The desired outcome adds a further reason, often a trade-off between two things you cannot always have together.',ul:['<b>Interpretability:</b> how easily a human can understand why a model made a decision. A decision tree is highly interpretable, a <b>white box</b>: you can follow its rules.','<b>Predictive power:</b> how accurately a model performs. Complex models such as neural networks often achieve the highest accuracy but are <b>black boxes</b>: their workings are too complex to follow.','As models get more complex they tend to gain predictive power and lose interpretability.','<b>A bank</b> that must tell a customer why a loan was refused needs interpretability: choose a white-box model even at the cost of a little accuracy.','<b>An image-recognition competition</b> where only the final score counts needs predictive power: a black-box model is right.','Same trade-off, resolved in opposite directions, because the desired outcomes differ.']}
  ],
  tables:[{h:'Summary reference',head:['Term','What it means'],rows:[
    ['Model selection','Comparing candidate models and choosing the best for a specific task'],['No single best model','No algorithm performs best on every problem; the best depends on data and problem'],['Nature of the problem','Regression, classification or clustering; points to a model family'],['Data characteristics','Size and shape of the data, which affect how well a model performs'],['Overfitting risk','A complex model on small data may learn noise rather than the pattern'],['Interpretability','How easily a human can understand why a model decided'],['Predictive power','How accurately a model performs; often highest in complex black boxes'],['White box model','Interpretable model whose reasoning can be followed (decision tree)'],['Black box model','Model whose internal workings are hard to follow (neural network)']]}],
  keys:[{t:'Key idea',html:'Interpretability and predictive power often pull in opposite directions. The right balance is set by the task: choose interpretability when a decision must be explained, and predictive power when only the accuracy of the result matters.'}],
  traps:['Assuming a more complex model is automatically better. On a small or simple dataset a neural network can do worse than a simple model because it overfits.','Listing factors without reasoning. Tie your choice to the data and the problem, not to the model\'s sophistication, and use the word "because".','Forgetting the stated requirement. A hospital that must justify each prediction needs interpretability.'],
  gloss:[['Model selection','Comparing models and choosing the best for a task.'],['No Free Lunch','No algorithm is best for every problem.'],['White box','Interpretable model.'],['Black box','Model too complex to follow.'],['Interpretability','How easily a human can understand a decision.'],['Predictive power','How accurately the model performs.']],
  quiz:[
    {t:'one',q:'Which principle says no algorithm is best for every problem?',o:['The "No Free Lunch" principle','The overfitting principle','The activation principle','The convolution principle'],a:0,why:'No Free Lunch.'},
    {t:'one',q:'A task requires predicting a house price. Which model type is the natural fit?',o:['Linear regression','k-means clustering','A CNN for images','None, prices cannot be predicted'],a:0,why:'A continuous number is a regression problem.'},
    {t:'one',q:'A bank must tell a customer exactly why a loan was refused. Which factor should weigh most?',o:['Interpretability, even at some cost to accuracy','Predictive power whatever the cost','The age of the algorithm','The size of the model file'],a:0,why:'The decision must be explained.'},
    {t:'one',q:'A deep neural network is trained on a very small dataset. The likely result is:',o:['It overfits, learning noise rather than the pattern','It always beats simpler models','It cannot be trained','It becomes more interpretable'],a:0,why:'Complex model plus small data means overfitting.'},
    {t:'multi',q:'Select <b>all</b> factors that should guide model selection.',o:['The nature of the problem (regression, classification, clustering)','The characteristics of the data (size, linearity)','The alphabetical order of the algorithm\'s name','Which model was published most recently'],a:[0,1],why:'Problem and data matter.'},
    {t:'tf',q:'A more complex model always performs better than a simpler one.',a:false,why:'It can overfit small or simple data.'},
    {t:'tf',q:'A decision tree is generally more interpretable than a deep neural network.',a:true,why:'You can follow its rules.'},
    {t:'one',q:'A "white box" model whose decisions a human can follow has high ___, whereas a complex "black box" often has higher ___.',o:['interpretability, predictive power','predictive power, interpretability','cost, speed','bias, variance'],a:0,why:'That is the trade-off.'},
    {t:'one',q:'Which model best suits recognising objects in images?',o:['Linear regression','k-means','Convolutional neural network','Decision stump'],a:2,why:'CNNs learn spatial feature hierarchies.'},
    {t:'one',q:'Which problem type suits a decision tree or K-NN?',o:['Predicting a continuous value','Finding groups in unlabelled data','Sorting items into categories','Recognising objects in images only'],a:2,why:'Classification.'}
  ],
  paper:[
    {q:'Explain why model selection and comparison are important in machine learning.',m:3,pts:['No single model is best for every problem; different algorithms give different results on the same data.','Performance depends on the nature of the problem and the characteristics of the data (size, shape of relationship).','So models must be compared and the one best fitted to the task chosen (a complex model may overfit small data).']},
    {q:'A hospital wants a model that predicts whether a tumour is malignant and must justify each prediction to doctors. Explain which factors would guide the choice of model, and the trade-off involved.',m:4,pts:['The problem is classification (malignant or not) so a classifier such as a decision tree or neural network is suitable.','The data size matters: a complex model may overfit a small dataset.','Interpretability is needed because predictions must be justified, so a white-box model such as a decision tree is preferred.','Trade-off: a black-box model such as a neural network may be more accurate (predictive power) but cannot explain its reasoning.']}
  ]

T.push({
  id:'a441',code:'A4.4.1',group:'Ethics',short:'Ethics of machine learning',title:'Ethical implications of machine learning',
  blurb:'Nine issues, biased data and online communication.',
  verb:'Discuss',cmd:'Give a balanced account, not a list. Weigh benefits as well as harms, and consider the different people affected. For a scenario, name the issues, explain why each matters, and reach a supported view.',
  ls:'Discuss the ethical implications of machine learning: accountability, fairness, bias, consent, environment, privacy, security, societal impact and transparency, with bias in training data and online communication.',
  lead:'Machine learning already decides who gets a loan, what news people see and how a self-driving car reacts. Because these systems affect real lives, their use raises ethical questions with <b>no single right answer</b>: a tool that helps one group can quietly disadvantage another.',
  hook:'A company trains a hiring tool on twenty years of its own hiring decisions. Nobody programmed it to prefer men. Why might it prefer them anyway, and who is responsible?',
  stageTitle:'3D lab: ethics under the microscope',stageSub:'Explore the nine issues, run a bias feedback loop, and rank a feed',
  lab:{how:['On <b>Nine issues</b>, click each block (or the button list) to read what it means, why it matters and a real example.','On <b>Bias feedback loop</b>, set the starting bias, then press <b>Run one cycle</b> several times.','On <b>Engagement feed</b>, press <b>Click the top post</b> repeatedly. Then switch on <b>Balanced feed</b>.'],
    see:['Several issues usually touch one real system at the same time, and they often pull against each other.','A model trained on slightly biased data can send itself back to the same place, so each cycle amplifies the bias.','Optimising for engagement alone narrows what users see and favours sensational posts, so it can spread misinformation and form filter bubbles.']},
  sections:[
    {tag:'Issues',h:'The nine main ethical issues',p:'A single real-world system usually touches more than one of these.',ul:[
      '<b>Accountability:</b> who is responsible when an ML system causes harm: the developer, the company that deployed it, or the person who relied on it. Responsibility is shared and the law has not settled it, so those harmed may have no one clearly answerable. <i>Example:</i> a self-driving car causes a fatal crash and there is no agreed answer as to who is at fault.',
      '<b>Algorithmic fairness:</b> the goal that outcomes should be equitable across groups. Hard to reach because "fair" can be defined in competing ways, and a model tuned only for overall accuracy may still treat some groups worse. <i>Example:</i> a reoffending-risk model should not give harsher scores to one ethnic group for the same behaviour.',
      '<b>Bias:</b> systematically unfair results, usually because training data reflects an unequal world, not because anyone set out to discriminate. <i>Example:</i> a recruiting tool marked down CVs mentioning "women\'s" because past hires were mostly men.',
      '<b>Consent:</b> whether people genuinely agreed to their data being used for training. Clicking "accept" on a long agreement is not understanding, so informed consent is often missing. <i>Example:</i> a photo posted years ago used to train a commercial face-recognition system its subject has never heard of.',
      '<b>Environmental impact:</b> training and running large models uses a great deal of electricity in data centres, with a carbon cost that grows as models get larger. <i>Example:</i> training one large model can release a significant amount of carbon dioxide.',
      '<b>Privacy:</b> ML gathers large amounts of personal data, and its skill at finding patterns can reveal things people never meant to share. <i>Example:</i> inferring a health condition or beliefs from purchases or liked posts.',
      '<b>Security:</b> models can be attacked or tricked; adversarial inputs make changes too small for a person to notice but large enough to fool the model. <i>Example:</i> stickers on a stop sign make a self-driving car read a speed-limit sign.',
      '<b>Societal impact:</b> the broad effect of widespread ML on society: jobs lost to automation, widening inequality, changes to how people find information. <i>Example:</i> automated systems replacing customer-service or transport roles.',
      '<b>Transparency:</b> whether a decision can be explained. The most accurate models are often black boxes, so affected people cannot see why a decision was made or challenge it. <i>Example:</i> a person refused a loan by a deep-learning model cannot learn why, so cannot appeal.']},
    {tag:'Tension',h:'The issues pull against each other',p:'More data can mean better predictions but less privacy. A more accurate model is often less transparent. Discussing ethics means <b>weighing these tensions</b>, not just naming the issues.'},
    {tag:'Bias',h:'The challenge of biased training data',p:'A model is only as good as the data it learns from. If the data reflects a biased world the model learns the bias and can make it worse: <b>"garbage in, garbage out"</b>. It is the single most common source of ethical problems in ML.',ul:['Bias <b>feeds on itself</b>. A police force trains a model on historical arrest data to predict where crime will happen.','Areas policed heavily in the past show more recorded arrests, so the model sends officers back there.','More officers produce more arrests, which become new data that appears to confirm the model was right.','The bias is not just repeated but <b>amplified</b> with each cycle.'],p2:'Bias comes mostly from the <b>data</b>, not from an algorithm written to be unfair. So check the data, and watch for feedback loops, as much as the code.'},
    {tag:'Online',h:'Ethics of ML in online communication',p:'Platforms run on ML built to maximise <b>engagement</b>, the time people spend on the platform. Optimising for that single goal has side effects.',ul:['<b>Misinformation:</b> algorithms promote content that provokes a strong reaction, often sensational or false, so a striking claim travels further than a measured correction. Repeatedly recommending agreeable content creates <b>filter bubbles</b> that hide other viewpoints and deepen polarisation.','<b>Bias:</b> ranking systems can give some voices, topics or groups far more reach than others. Because the algorithm decides what millions see, a small bias scales to a large effect.','<b>Online harassment:</b> ML can detect and block abuse at a scale no human team could match, but struggles with sarcasm, context and cultural nuance, so it both misses real harassment and sometimes removes legitimate speech.','<b>Anonymity:</b> protects people who need it (whistleblowers, vulnerable users) but can shield abusers. ML can help identify a persistent harasser, but can equally be turned on someone relying on anonymity for safety.','<b>Privacy:</b> ML can <b>de-anonymise</b> people by combining separate pieces of supposedly anonymous data to re-identify an individual.'],p2:'The same algorithm can help and harm. A balanced discussion judges how benefits and harms weigh up, not whether the technology is simply good or bad.'}
  ],
  tables:[{h:'Summary reference',head:['Ethical issue','What it means'],rows:[
    ['Accountability','Who is responsible when an ML system causes harm'],['Algorithmic fairness','Making a model\'s outcomes equitable, not discriminatory'],['Bias','Systematically unfair results, usually learned from the data'],['Consent','Whether people agreed to their data being used in this way'],['Privacy','Protecting personal data collected and used by models'],['Security','A model\'s vulnerability to being tricked or attacked'],['Transparency','Whether a model\'s decision can be explained (black box problem)'],['Environmental impact','The energy used to train and run large models'],['Societal impact','Broader effects such as job displacement and inequality'],['Garbage in, garbage out','Biased or poor data produces a biased or poor model'],['Filter bubble','Being shown mainly content that reinforces existing views'],['De-anonymisation','Re-identifying a person by combining anonymous data']]}],
  keys:[{t:'Key idea',html:'Ethical issues rarely stand alone and rarely have one right answer. Name the issue, say why it matters, say who is affected, weigh benefits against harms, and reach a supported view.'},{t:'Key idea',html:'Bias in a model comes mostly from the <b>data</b>. Biased data trains a biased model, whose predictions create more biased data. Check the data and watch for feedback loops.'}],
  traps:['Simply <b>listing</b> ethical terms. A discuss answer needs reasons, more than one side and a supported conclusion.','Saying the algorithm was <b>programmed</b> to discriminate. Bias usually comes from training data that reflects an unequal world.','Treating the technology as simply good or bad. The same algorithm can help (remove abuse) and harm (remove legitimate speech).','Mixing up <b>privacy</b> (protecting personal data) and <b>consent</b> (whether people agreed to its use), or <b>transparency</b> (explaining a decision) and <b>accountability</b> (who is responsible).','Ignoring the people affected. Name who is helped and who is disadvantaged.'],

  quiz:[
    {t:'one',q:'A hiring tool trained on 20 years of company data ranks male candidates higher than female candidates. This is a classic example of:',o:['An adversarial attack','Algorithmic bias from training data','Poor model security','A lack of accountability'],a:1,why:'The data reflected past hiring that favoured men.'},

    {t:'one',q:'Small, specially designed stickers on a STOP sign make an AI misclassify it. This is:',o:['A privacy breach','A filter bubble','An adversarial attack (a security issue)','An environmental impact'],a:2,why:'Tiny changes fool the model.'},
    {t:'one',q:'A company scrapes people\'s photos from social media, without asking, to train a facial-recognition model. The clearest concern is:',o:['Privacy and consent','Environmental impact','Model security','Transparency'],a:0,why:'Personal data used without agreement.'},
    {t:'one',q:'The main environmental concern with training large ML models is:',o:['The large amount of electricity used by data centres','The noise from cooling fans','The plastic in the packaging','The cost of software licences'],a:0,why:'Electricity has a carbon cost.'},
    {t:'multi',q:'Select <b>all</b> statements that explain why an ML model can be biased.',o:['The training data reflects existing human or societal biases','The model learns, and can amplify, the patterns in that data','The algorithm was deliberately written to treat people unfairly','The hardware running the model is too slow'],a:[0,1],why:'Bias usually comes from data, not intent.'},

  paper:[

function markNav(id){$$('.side a').forEach(a=>{const on=(id==='home'&&a.dataset.home)||a.dataset.id===id;if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}
function shuffle(arr,seed){const r=rng(seed);const a=arr.map((v,i)=>[v,i]);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function hashSeed(s){let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619);}return x>>>0;}

/* ----- quiz ----- */
function renderQuiz(t,host){
  const items=t.quiz||[];let answered=0,correct=0;const done=new Array(items.length).fill(false);
  const sc=h('div',{class:'score'});const list=h('div');
  const paint=()=>{sc.innerHTML='';sc.append(h('span',{class:'n'},correct+' / '+items.length),h('span',null,answered<items.length?('Answered '+answered+' of '+items.length+'. Pick an answer to see why it is right or wrong.'):(correct===items.length?'Perfect. You can move to the next topic.':'Quiz complete. Read the explanations for the ones you missed, then retry.')),
      answered?h('button',{class:'btn',onclick:()=>{host.innerHTML='';renderQuiz(t,host);}},'Retry'):null);};
  const fin=(i,ok)=>{if(done[i])return;done[i]=true;answered++;if(ok)correct++;paint();if(answered===items.length)setDone(t.id,correct,items.length);};
  items.forEach((it,i)=>{
    const box=h('div',{class:'q'},h('span',{class:'qn'},'Question '+(i+1)+' of '+items.length+'  ·  '+({one:'choose one',multi:'choose all that apply',tf:'true or false',order:'put in order'}[it.t])),h('div',{class:'qt',html:it.q}));
    const why=h('div',{class:'why',hidden:true,html:'<b>Why: </b>'+it.why});
    const reveal=ok=>{why.hidden=false;why.prepend(h('b',{style:'color:var(--'+(ok?'good':'bad')+')'},ok?'Correct. ':'Not quite. '));};
    if(it.t==='one'||it.t==='tf'){
      const opts=it.t==='tf'?['True','False']:it.o;const corr=it.t==='tf'?(it.a?0:1):it.a;
      const perm=it.t==='tf'?opts.map((_,k)=>[opts[k],k]):shuffle(opts,hashSeed(t.id+i));
      const wrap=h('div',{class:'opts'});const btns=[];
      perm.forEach(([txt,orig],k)=>{const b=h('button',{class:'opt'},h('span',{class:'l'},String.fromCharCode(65+k)),h('span',{html:txt}));b.dataset.o=orig;btns.push(b);
        b.addEventListener('click',()=>{if(done[i])return;btns.forEach(x=>{x.disabled=true;if(+x.dataset.o===corr)x.classList.add('ok');});const ok=orig===corr;if(!ok)b.classList.add('no');reveal(ok);fin(i,ok);});wrap.append(b);});
      box.append(wrap);
    }else if(it.t==='multi'){
      const perm=shuffle(it.o,hashSeed(t.id+i));const wrap=h('div',{class:'opts'});const btns=[];
      perm.forEach(([txt,orig],k)=>{const b=h('button',{class:'opt','aria-pressed':'false'},h('span',{class:'l'},String.fromCharCode(65+k)),h('span',{html:txt}));b.dataset.o=orig;btns.push(b);
        b.addEventListener('click',()=>{if(done[i])return;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');});wrap.append(b);});
      const chk=h('button',{class:'btn pri',style:'margin-top:10px',onclick:()=>{if(done[i])return;let ok=true;btns.forEach(x=>{const sel=x.getAttribute('aria-pressed')==='true';const should=it.a.includes(+x.dataset.o);if(sel!==should)ok=false;x.disabled=true;x.classList.remove('ok','no');if(should)x.classList.add('ok');else if(sel)x.classList.add('no');});chk.hidden=true;reveal(ok);fin(i,ok);}},'Check answer');
      box.append(wrap,chk);
    }else if(it.t==='order'){
      const perm=shuffle(it.o,hashSeed(t.id+'o'+i));const pool=h('div',{class:'pool'});const ans=h('div',{class:'ans'});const picked=[];
      const mkb=(txt,orig)=>{const b=h('button',{class:'opt',html:txt});b.dataset.o=orig;return b;};
      perm.forEach(([txt,orig])=>{const b=mkb(txt,orig);b.addEventListener('click',()=>{if(done[i])return;if(b.parentNode===pool){ans.append(b);}else{pool.append(b);}});pool.append(b);});
      const chk=h('button',{class:'btn pri',onclick:()=>{if(done[i])return;const got=[...ans.children].map(x=>+x.dataset.o);const ok=got.length===it.o.length&&got.every((v,k)=>v===k);
        [...ans.children].forEach((x,k)=>{x.classList.add(+x.dataset.o===k?'ok':'no');x.disabled=true;});[...pool.children].forEach(x=>x.disabled=true);chk.hidden=true;
        if(!ok){why.append(h('div',{html:'<br><b>Correct order:</b><ol>'+it.o.map(s=>'<li>'+s+'</li>').join('')+'</ol>'}));}reveal(ok);fin(i,ok);}},'Check order');
      box.append(h('div',{class:'ord'},h('span',{class:'qn'},'Tap items to build the sequence (tap again to remove). First step at the top-left.'),ans,pool,chk));
    }
    box.append(why);list.append(box);});
  host.append(sc,list);paint();
}

function renderPaper(t,host){
  const dr=store.get('draft.'+t.id,{});
  (t.paper||[]).forEach((p,i)=>{
    const ta=h('textarea',{placeholder:'Write your answer here, as you would in the exam. Aim for one clear point per mark.','aria-label':'Your answer to question '+(i+1)});ta.value=dr[i]||'';
    ta.addEventListener('input',()=>{const d=store.get('draft.'+t.id,{});d[i]=ta.value;store.set('draft.'+t.id,d);});
    const pts=h('div',{class:'pts',hidden:true});const res=h('div',{class:'m'});
    const upd=()=>{const n=$$('input:checked',pts).length;res.textContent='Self-marked: '+Math.min(n,p.m)+' / '+p.m+' marks';};
    p.pts.forEach(s=>{const c=h('input',{type:'checkbox'});c.addEventListener('change',upd);pts.append(h('label',{class:'ck'},c,h('span',{html:s})));});
    pts.append(res);
    const b=h('button',{class:'btn',onclick:()=>{pts.hidden=!pts.hidden;b.textContent=pts.hidden?'Show marking points':'Hide marking points';}},'Show marking points');
    host.append(h('div',{class:'paper'},h('span',{class:'m'},'Question '+(i+1)+'  ·  ['+p.m+' marks]'),h('div',{class:'qt',style:'font-weight:600',html:p.q}),ta,b,h('p',{class:'tip',style:'padding:8px 0 0'},'Write first, then reveal the points and tick each one your answer made. Each point is worth one mark.'),pts));});
}

    const S=new Stage(r.hv,h('div'),h('div'),h('div'),h('div'));cur=S;if(!S.dead){S.ui.reset=()=>{};try{SC.home(S,S.ui);}catch(e){console.error(e);}}
